# SunRey Hetzner sandbox reverse proxy (api.sunrey.xyz → Consumer BFF).
#
# TLS terminates at Cloudflare or a host-level certificate. This listener is
# bound to 127.0.0.1:8443 for origin routing; pair with host nginx/Caddy or a
# Cloudflare tunnel that forwards to this port.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream sunrey_consumer_bff {
        server consumer-bff:8443;
        keepalive 16;
    }

    server {
        listen 8443;
        server_name api.sunrey.xyz;

        # When terminating TLS on this host, enable ssl directives and mount certs.
        # ssl_certificate     /etc/ssl/certs/api.sunrey.xyz.pem;
        # ssl_certificate_key /etc/ssl/private/api.sunrey.xyz.key;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        location = /health {
            proxy_pass http://sunrey_consumer_bff;
            access_log off;
        }

        location = /ready {
            proxy_pass http://sunrey_consumer_bff;
            access_log off;
        }

        location /api/ {
            proxy_pass http://sunrey_consumer_bff;
        }

        location / {
            proxy_pass http://sunrey_consumer_bff;
        }

        location /internal/ {
            return 403;
        }
    }
}
