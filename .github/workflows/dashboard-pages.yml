name: Dashboard (dashboard.sunrey.xyz)

# Builds and verifies the zero-dependency desktop dashboard on every PR that
# touches it, deploys a preview for PRs, and deploys production only from main
# through the protected `dashboard-production` environment (required reviewers
# are configured in GitHub, not here). Deploys need repository secrets
# CLOUDFLARE_API_TOKEN (Pages:Edit only) and CLOUDFLARE_ACCOUNT_ID.

on:
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/dashboard-pages.yml'
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/dashboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: sunrey-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        env:
          SUNREY_DASHBOARD_API_BASE: https://api.sunrey.xyz
          SUNREY_DASHBOARD_ENV_LABEL: Sandbox
          SUNREY_DASHBOARD_EXPLORER_URL: ${{ vars.SUNREY_EXPLORER_URL }}
        run: node apps/dashboard/build.mjs
      - name: Syntax check every module
        run: find apps/dashboard/dist/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: No HTML injection sinks or inline handlers
        run: |
          ! grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|document\.write|eval\(|new Function' apps/dashboard/src/js
          ! grep -rnE ' on[a-z]+="' apps/dashboard/src/index.html
      - name: No secrets or live flags in the bundle
        run: |
          ! grep -rniE 'LIVE_[A-Z_]*=true|PRODUCTION_ACTIVE=true|MAINNET_ACTIVE=true|sk_live|BEGIN (RSA|EC|PRIVATE)' apps/dashboard/dist
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: apps/dashboard/dist
          retention-days: 30

  preview:
    # Deploy jobs stay off until Cloudflare is configured: set repository
    # variable DASHBOARD_DEPLOY_ENABLED=true after adding the secrets.
    if: vars.DASHBOARD_DEPLOY_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    environment: dashboard-preview
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dist
      - name: Deploy preview (protect *.pages.dev previews with Cloudflare Access)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=pr-${{ github.event.number }} --commit-hash=${{ github.sha }}

  production:
    if: vars.DASHBOARD_DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: dashboard-production
      url: https://dashboard.sunrey.xyz
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dist
      - name: Deploy to Cloudflare Pages (production branch)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
      - name: Verify the live site serves this release
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS https://dashboard.sunrey.xyz/js/config.js || true)
            echo "$body" | grep -q "\"release\": \"${GITHUB_SHA:0:12}\"" && exit 0
            sleep 20
          done
          echo "dashboard.sunrey.xyz is not serving ${GITHUB_SHA:0:12}" >&2
          exit 1
      - name: Verify security headers
        run: |
          headers=$(curl -fsSI https://dashboard.sunrey.xyz/)
          echo "$headers" | grep -qi '^content-security-policy:.*connect-src https://api.sunrey.xyz'
          echo "$headers" | grep -qi '^strict-transport-security:'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
