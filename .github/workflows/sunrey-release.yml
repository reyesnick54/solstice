# Protected release workflow. Not used for ordinary PR tests.
# Fork/untrusted PR code does not receive release credentials.
name: SunRey release

on:
  workflow_dispatch:
  push:
    tags:
      - "sunrey-testnet-v*"

permissions:
  contents: read

jobs:
  release:
    name: sign-and-bundle
    runs-on: ubuntu-latest
    environment: simulation-release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Build signed testnet bundle
        run: node scripts/sunrey-release.mjs build

      - name: Verify bundle
        run: node scripts/sunrey-release.mjs verify

      - name: Generate independent security-review bundle
        run: node scripts/sunrey-audit.mjs generate

      - name: Verify independent security-review bundle
        run: node scripts/sunrey-audit.mjs verify dist/sunrey-audit

      - name: Retain artifacts locally for 90 days of operator policy
        run: |
          test -f dist/testnet-release/release-manifest.json
          test -f dist/testnet-release/signature.json
          echo "artifact retention policy: ${{ 90 }} days (operator / provider storage)"
