name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: "[ARCHITECTURE] → [PRODUCTION SAFETY] → [RUST] → [TEST] → [TYPECHECK] → [SECURITY]"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: "[INTEGRITY] Pre-install repository integrity"
        run: |
          node scripts/check-json-integrity.mjs
          node scripts/validate-json.mjs
          node scripts/check-merge-integrity.mjs

      - name: "[TYPECHECK] Install from lockfile"
        run: npm ci --ignore-scripts

      - name: "[INTEGRITY] Dependency-backed repository integrity"
        run: |
          node scripts/check-case-collisions.mjs
          node scripts/check-lockfiles.mjs
          node scripts/check-yaml-integrity.mjs
          node scripts/validate-free-api-catalog.mjs

      - name: "[ARCHITECTURE] Invariants, authority, freeze, kernel"
        run: |
          python3 scripts/lint-architectural-invariants.py
          python3 scripts/extraction-dryrun.py
          python3 scripts/check-package-boundaries.py
          npm run lint:architecture
          npm run naming:audit
          node scripts/check-authority-map.mjs
          node scripts/check-architecture-freeze.mjs
          node scripts/check-build-status.mjs
          npm run gate
          node --experimental-strip-types --disable-warning=ExperimentalWarning --test --test-reporter=spec packages/access-economy/src/architecture-guards.test.ts

      - name: "[PRODUCTION SAFETY] Deployment posture and production-off defaults"
        run: |
          python3 scripts/check-deployment-posture.py
          node scripts/check-production-safety.mjs

      - name: "[API] OpenAPI and migration contracts"
        run: |
          node scripts/check-api-specs.mjs
          node scripts/check-migration-quality.mjs

      - name: Setup Rust (repository-pinned toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
          components: rustfmt, clippy

      - name: "[RUST] check / fmt / clippy / test"
        working-directory: packages/sunrey-chain/rust
        run: |
          cargo check --workspace --locked
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: "[GENERATED DRIFT] Release artifact drift"
        run: node scripts/check-generated-drift.mjs

      - name: "[SECURITY] Release assurance"
        run: |
          node scripts/sunrey-release.mjs audit
          node scripts/sunrey-release.mjs sbom
          node scripts/sunrey-release.mjs provenance
          node scripts/sunrey-release.mjs compare-builds
          node scripts/sunrey-release.mjs sign
          node scripts/sunrey-release.mjs verify
          node scripts/sunrey-audit.mjs generate
          node scripts/sunrey-audit.mjs verify dist/sunrey-audit
          node scripts/static-security-lint.mjs

      - name: "[TEST] Access economy regression suite"
        run: npm run test:access

      - name: "[TEST] Fuzz and formal smoke"
        run: |
          npm run test:fuzz-smoke
          npm run test:formal-smoke

      - name: "[TYPECHECK] No-new-TypeScript-errors gate"
        run: node scripts/typecheck-regression-gate.mjs

      - name: "[SECURITY] Secret and container checks"
        run: |
          python3 scripts/secret-scan.py
          python3 scripts/secret-scan.py --self-test
          node scripts/check-container-pins.mjs

      - name: "[BACKEND RC] Qualify release candidate"
        run: npm run qualify:backend-rc

  persistence:
    name: "[DATABASE] postgres → migrate → persistence-integration"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solstice_bootstrap
          POSTGRES_PASSWORD: solstice_dev_only_not_for_production
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solstice_bootstrap -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SUNREY_PG_HOST: 127.0.0.1
      SUNREY_PG_PORT: "5432"
      SUNREY_PERSISTENCE_TEST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Database integrity and migrations
        run: |
          node scripts/check-json-integrity.mjs
          node scripts/check-merge-integrity.mjs
          node scripts/check-migration-quality.mjs
          npm run db:migrate
          npm run test:persistence
          npm run qualify:backend-db -- --skip-persistence

  architecture-freeze:
    name: "[ARCHITECTURE] authority-map + freeze + kernel + posture"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Architecture release gate
        run: |
          node scripts/check-json-integrity.mjs
          node scripts/validate-json.mjs
          node scripts/check-merge-integrity.mjs
          node scripts/check-case-collisions.mjs
          node scripts/check-authority-map.mjs
          node scripts/check-architecture-freeze.mjs
          npm run lint:architecture
          npm run gate
          python3 scripts/check-deployment-posture.py
          node scripts/check-production-safety.mjs

  api-contracts:
    name: "[API] OpenAPI parse, refs, operation IDs"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: API contract gate
        run: |
          node scripts/check-json-integrity.mjs
          node scripts/validate-json.mjs
          node scripts/check-merge-integrity.mjs
          node scripts/check-case-collisions.mjs
          node scripts/check-yaml-integrity.mjs
          node scripts/validate-free-api-catalog.mjs
          node scripts/check-api-specs.mjs

  production-safety:
    name: "[PRODUCTION SAFETY] PRODUCTION_* and live connectivity remain off"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Production safety gate
        run: |
          node scripts/check-json-integrity.mjs
          node scripts/validate-json.mjs
          node scripts/check-merge-integrity.mjs
          node scripts/check-case-collisions.mjs
          node scripts/check-production-safety.mjs
          python3 scripts/check-deployment-posture.py

  backend-rc:
    name: "[BACKEND RC] local OCI artifacts + qualify"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Backend release candidate gate
        run: |
          node scripts/check-json-integrity.mjs
          node scripts/validate-json.mjs
          node scripts/check-merge-integrity.mjs
          node scripts/check-case-collisions.mjs
          npm run build:backend-rc-artifacts -- --require-container
          npm run qualify:backend-rc
          node scripts/check-production-safety.mjs
          python3 scripts/secret-scan.py

  full-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: "[MAIN] full regression + launch rehearsal"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: "[INTEGRITY] Repository preflight"
        run: |
          node scripts/check-json-integrity.mjs
          node scripts/validate-json.mjs
          node scripts/check-merge-integrity.mjs
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Full repository regression
        run: npm test
      - name: Launch rehearsal
        run: |
          npm run sunrey-ceremony -- rehearse
          npm run sunrey-launch -- production verify
          npm run qualify:backend-rc
      - name: Strict TypeScript debt report
        continue-on-error: true
        run: npm run typecheck
