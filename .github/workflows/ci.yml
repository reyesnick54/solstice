name: ci

on:
  push:
    branches: [main, 'cursor/**', 'feat/**']
  pull_request:

jobs:
  ci:
    name: architectural-invariants → posture → gate → tests → demo → typecheck → secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Deployment posture
        run: python3 scripts/check-deployment-posture.py

      - name: Kernel and Phase 9 gating
        run: npm run gate

      - name: Tests
        run: npm test

      - name: End-to-end demo
        run: npm run demo

      - name: Typecheck
        run: npm run typecheck

      - name: Secret scan
        run: python3 scripts/secret-scan.py
