name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: architectural-invariants → deployment-posture → kernel-gating → tests → e2e-demo → typecheck → secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Architectural invariants
        run: |
          python3 scripts/lint-architectural-invariants.py
          python3 scripts/extraction-dryrun.py
          npm run lint:architecture

      - name: Deployment posture
        run: python3 scripts/check-deployment-posture.py

      - name: Kernel gating
        run: npm run gate

      - name: Tests
        run: npm test

      - name: End-to-end demo
        run: npm run demo

      - name: Typecheck
        run: npm run typecheck

      - name: Secret scan
        run: python3 scripts/secret-scan.py
