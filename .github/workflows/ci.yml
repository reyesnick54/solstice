name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: architectural-invariants → deployment-posture → kernel-gating → tests → e2e-demo → typecheck → secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Lockfile enforcement
        run: node scripts/check-lockfiles.mjs

      - name: Architectural invariants
        run: |
          python3 scripts/lint-architectural-invariants.py
          python3 scripts/extraction-dryrun.py
          npm run lint:architecture
          npm run naming:audit

      - name: Deployment posture
        run: python3 scripts/check-deployment-posture.py

      - name: Kernel gating
        run: npm run gate

      - name: Setup Rust 1.83
        uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy

      - name: Setup Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Rust fmt / clippy / test (local node)
        working-directory: packages/sunrey-chain/rust
        run: |
          cargo +1.83.0 fmt --check
          cargo +1.83.0 clippy --all-targets --locked -- -D warnings
          cargo +1.83.0 test --workspace --locked

      - name: Dependency audit and license inventory
        run: node scripts/sunrey-release.mjs audit

      - name: SBOM and provenance
        run: |
          node scripts/sunrey-release.mjs sbom
          node scripts/sunrey-release.mjs provenance
          node scripts/sunrey-testnet-sbom.mjs

      - name: Two-builder reproducibility
        run: node scripts/sunrey-release.mjs compare-builds

      - name: Artifact sign and verify
        run: |
          node scripts/sunrey-release.mjs sign
          node scripts/sunrey-release.mjs verify

      - name: Independent security-review bundle
        run: |
          node scripts/sunrey-audit.mjs generate
          node scripts/sunrey-audit.mjs verify dist/sunrey-audit
          node scripts/sunrey-audit.mjs reproduce

      - name: Generated-code drift
        run: node scripts/check-generated-drift.mjs

      - name: Static analysis (Rust clippy already -D warnings; TS security lint)
        run: node scripts/static-security-lint.mjs

      - name: Tests
        run: |
          npm run test:sunrey-node
          npm test
          npm run sunrey-ceremony -- rehearse
          npm run sunrey-ceremony -- production rehearse
          npm run sunrey-ops -- production inventory
          npm run sunrey-ops -- production baseline
          npm run sunrey-ops -- production access
          npm run sunrey-ops -- production operators
          npm run sunrey-ops -- production slo
          npm run sunrey-ops -- production incidents
          npm run sunrey-ops -- production backups
          npm run sunrey-ops -- production restore-drill
          npm run sunrey-ops -- production providers
          npm run sunrey-ops -- production changes
          npm run sunrey-ops -- production evidence-seal
          npm run sunrey-ops -- production handoff
          npm run sunrey-ops -- production readiness
          npm run sunrey-ops -- production rehearse
          npm run sunrey-launch -- production execute
          npm run sunrey-launch -- production verify
          npm run sunrey-bench -- sanity

      - name: Fuzz smoke
        run: npm run test:fuzz-smoke

      - name: Formal smoke
        run: npm run test:formal-smoke

      - name: End-to-end demo
        run: npm run demo
      - name: Card simulation demo
        run: npm run demo:cards
      - name: Personal Economic Graph demo
        run: npm run demo:peg
      - name: Wallet simulation demo
        run: npm run demo:wallet
      - name: Tap-to-pay simulation demo
        run: npm run demo:acceptance
      - name: Growth Orchestrator demo
        run: npm run demo:growth
      - name: Personal Economic Value Engine demo
        run: npm run demo:peve
      - name: Treasury routing demo
        run: npm run demo:treasury
      - name: Investments paper portfolio demo
        run: npm run demo:investments
      - name: Regulatory Digital Twin demo
        run: npm run demo:rdt
      - name: Investment risk and model registry demo
        run: npm run demo:risk
      - name: Personal Data Vault demo
        run: npm run demo:pdv
      - name: Strategy Lab demo
        run: npm run demo:strategy-lab
      - name: Agentic Capital Mesh demo
        run: npm run demo:mesh
      - name: Consent ledger and purpose firewall demo
        run: npm run demo:consent
      - name: Privacy Clean Room demo
        run: npm run demo:clean-room
      - name: SunRey Coin simulation ledger demo
        run: npm run demo:sunrey-coin
      - name: Human Information Network marketplace demo
        run: npm run demo:information-market
      - name: Human Information Network production-candidate demo
        run: npm run demo:sunrey-human-information-network
      - name: Human Information Network chain-anchor foundation demo
        run: npm run demo:sunrey-hin-chain-anchor-foundation
      - name: Human Information Network chain-anchor finality demo
        run: npm run demo:sunrey-hin-chain-finality
      - name: SunRey AI runtime demo
        run: npm run demo:sunrey-ai-runtime
      - name: SunRey S3M primary provider demo
        run: npm run demo:sunrey-ai-s3m
      - name: SunRey human contribution ontology demo
        run: npm run demo:sunrey-human-contribution-ontology
      - name: SunRey human contribution registry demo
        run: npm run demo:sunrey-human-contribution-registry
      - name: Demo sunrey-chain
        run: npm run demo:sunrey-chain
      - name: MoonRey productive capacity demo
        run: npm run demo:moonrey-productive
      - name: SunRey economic unit normalization demo
        run: npm run demo:sunrey-unit-normalization
      - name: SunRey oracle network demo
        run: npm run demo:sunrey-oracle
      - name: SunRey production oracle onboarding demo
        run: npm run demo:sunrey-production-oracles
      - name: SunRey production oracle readiness
        run: npm run sunrey-oracle -- readiness
      - name: SunRey local node demo
        run: npm run demo:sunrey-node
      - name: SunRey P2P development network demo
        run: npm run demo:sunrey-devnet
      - name: SunRey validator accountability demo
        run: npm run demo:sunrey-accountability
      - name: SunRey native asset four-validator demo
        run: npm run demo:sunrey-native-assets
      - name: SunRey native fees demo
        run: npm run demo:sunrey-fees
      - name: SunRey interoperability demo
        run: npm run demo:sunrey-interop
      - name: SunRey resilience and disaster-recovery demo
        run: npm run demo:sunrey-ops
      - name: SunRey sovereign wallets demo
        run: npm run demo:sunrey-wallet
      - name: SunRey validator operator demo
        run: npm run demo:sunrey-ops
      - name: SunRey public testnet demo
        run: npm run demo:sunrey-testnet
      - name: SunRey mainnet readiness rehearsal
        run: npm run demo:sunrey-mainnet
      - name: SunRey production infrastructure harness
        run: npm run demo:sunrey-infra
      - name: SunRey production environment plan
        run: SUNREY_FIXTURE_ENV=local npm run sunrey-ops -- production plan
      - name: SunRey production environment verify-plan
        run: SUNREY_FIXTURE_ENV=local npm run sunrey-ops -- production verify-plan
      - name: SunRey production environment rehearse
        run: SUNREY_FIXTURE_ENV=local npm run sunrey-ops -- production rehearse
      - name: SunRey mainnet candidate verify
        run: npm run sunrey-mainnet -- verify
      - name: SunRey mainnet launch rehearsal demo
        run: npm run demo:sunrey-launch
      - name: SunRey mainnet launch rehearsal verify
        run: npm run sunrey-launch -- verify
      - name: SunRey authorized genesis execution rehearsal
        run: npm run sunrey-launch -- production report
      - name: SunRey pre-genesis shadow qualification demo
        run: npm run demo:sunrey-pregenesis
      - name: SunRey pre-genesis shadow qualify
        run: SUNREY_FIXTURE_ENV=local npm run sunrey-ops -- pregenesis qualify
      - name: SunRey pre-genesis shadow verify
        run: SUNREY_FIXTURE_ENV=local npm run sunrey-ops -- pregenesis verify
      - name: SunRey validator economics demo
        run: npm run demo:sunrey-validator-economics
      - name: SunRey testnet deployment manifests
        run: node scripts/sunrey-testnet-validate-manifests.mjs
      - name: SunRey testnet SBOM and release manifest
        run: node scripts/sunrey-testnet-sbom.mjs
      - name: SunRey developer SDK demo
        run: npm run demo:sunrey-sdk
      - name: SunRey Exchange simulation demo
        run: npm run demo:sunrey-exchange
      - name: SunRey Exchange native settlement demo
        run: npm run demo:sunrey-exchange-native
      - name: SunRey Exchange four-validator DVP demo
        run: npm run demo:sunrey-exchange-settlement
      - name: Custody deposit and withdrawal demo
        run: npm run demo:custody
      - name: Institutional native-asset custody demo
        run: npm run demo:institutional-custody
      - name: Custody submission-unknown demo
        run: npm run demo:custody-unknown
      - name: Custody cold-signing demo
        run: npm run demo:custody-cold
      - name: Market surveillance demo
        run: npm run demo:market-surveillance
      - name: Listing governance demo
        run: npm run demo:listing-governance
      - name: SunRey explorer demo
        run: npm run demo:explorer
      - name: SunRey performance bench sanity demo
        run: npm run demo:sunrey-bench
      - name: SunRey adversarial range smoke campaign
        run: npm run sunrey-range -- campaign --smoke
      - name: SunRey adversarial range demo
        run: npm run demo:sunrey-range
      - name: SunRey MoonRey dual-economy simulation demo
        run: npm run demo:sunrey-dual-economy
      - name: SunRey dual-economy baseline CLI
        run: npm run sunrey-economics -- dual simulate --scenario baseline --epochs 2
      - name: SunRey economic stress smoke campaign
        run: npm run sunrey-economics -- stress campaign --id smoke
      - name: SunRey economic stress laboratory demo
        run: npm run demo:sunrey-economic-stress
      - name: SunRey Testnet RC smoke qualification
        run: node scripts/sunrey-release.mjs rc qualify --profile smoke
      - name: SunRey Testnet RC verify
        run: node scripts/sunrey-release.mjs rc verify
      - name: SunRey Testnet RC demo
        run: npm run demo:sunrey-rc
      - name: SunRey economic RC smoke qualification
        run: node scripts/sunrey-release.mjs economic create --profile smoke --id SUNREY_ECONOMIC_TESTNET_RC_1
      - name: SunRey economic RC verify
        run: node scripts/sunrey-release.mjs economic verify
      - name: SunRey economic RC demo
        run: npm run demo:sunrey-economic-rc
      - name: SunRey Mainnet RC smoke qualification
        run: SUNREY_FIXTURE_ENV=local node scripts/sunrey-release.mjs mainnet create --profile smoke --id SUNREY_MAINNET_RC_1
      - name: SunRey Mainnet RC qualify
        run: SUNREY_FIXTURE_ENV=local node scripts/sunrey-release.mjs mainnet qualify --profile smoke
      - name: SunRey Mainnet RC verify
        run: SUNREY_FIXTURE_ENV=local node scripts/sunrey-release.mjs mainnet verify
      - name: SunRey Mainnet RC demo
        run: npm run demo:sunrey-mainnet-rc
      - name: SunRey post-genesis rehearsal
        run: SUNREY_FIXTURE_ENV=local npm run sunrey-mainnet -- stabilization status
      - name: SunRey post-genesis checkpoint
        run: SUNREY_FIXTURE_ENV=local npm run sunrey-mainnet -- stabilization checkpoint 1 0 aaaaaaaa
      - name: SunRey post-genesis audit
        run: SUNREY_FIXTURE_ENV=local npm run sunrey-mainnet -- stabilization audit
      - name: SunRey capability activation negatives
        run: SUNREY_FIXTURE_ENV=local npm run sunrey-mainnet -- capability history
      - name: Universal economic exchange demo
        run: npm run demo:universal-exchange
      - name: SunRey independent security-review demo
        run: npm run demo:sunrey-audit

      - name: Typecheck
        run: npm run typecheck

      - name: Secret scan
        run: |
          python3 scripts/secret-scan.py
          python3 scripts/secret-scan.py --self-test
          if [ -d dist/testnet-release ]; then python3 scripts/secret-scan.py --root dist/testnet-release; fi
          if [ -d dist/sunrey-audit ]; then python3 scripts/secret-scan.py --root dist/sunrey-audit; fi

      - name: Container pin check
        run: node scripts/check-container-pins.mjs

  persistence:
    name: postgres → migrate → persistence-integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solstice_bootstrap
          POSTGRES_PASSWORD: solstice_dev_only_not_for_production
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solstice_bootstrap -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SUNREY_PG_HOST: 127.0.0.1
      SUNREY_PG_PORT: "5432"
      SUNREY_PERSISTENCE_TEST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Bootstrap and migrate empty databases
        run: npm run db:migrate

      - name: Persistence integration tests
        run: npm run test:persistence
