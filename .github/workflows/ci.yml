name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Kernel gating (fail on ungated state-changing paths)
        run: npm run gate
      - name: Tests
        run: npm test
      - name: Demo
        run: npm run demo
      - name: Typecheck
        run: npm run typecheck
