# Extended full-platform production-candidate qualification.
# Manual / scheduled only. No deployment side effects.
name: SunRey full-platform candidate

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Burn-in profile
        required: false
        default: STANDARD
        type: choice
        options:
          - STANDARD
          - EXTENDED
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  full-platform-candidate:
    name: full-platform-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: JSON / repository integrity preflight
        run: |
          node scripts/check-json-integrity.mjs
          node scripts/check-merge-integrity.mjs

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Full-platform STANDARD/EXTENDED burn-in
        env:
          SUNREY_FIXTURE_ENV: local
        run: npm run sunrey-ops -- production full-platform rehearse --profile ${{ inputs.profile || 'STANDARD' }}

      - name: Adversarial smoke plus verification
        env:
          SUNREY_FIXTURE_ENV: local
        run: npm run sunrey-ops -- production full-platform verify

      - name: Bundle report
        env:
          SUNREY_FIXTURE_ENV: local
        run: npm run sunrey-ops -- production full-platform report
