name: Formal extended

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"

jobs:
  formal-extended:
    name: FORMAL_EXTENDED bounded model campaign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Setup Rust 1.83
        uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy

      - name: Extended formal campaign
        env:
          FORMAL_PROFILE: FORMAL_EXTENDED
        run: npm run test:formal-extended
