# Manual / release-adjacent reviewer bundle. Not an audit result.
name: SunRey audit bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-bundle:
    name: generate-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Generate reviewer bundle
        run: node scripts/sunrey-audit.mjs generate

      - name: Verify bundle
        run: node scripts/sunrey-audit.mjs verify dist/sunrey-audit

      - name: Reproduction smoke
        run: node scripts/sunrey-audit.mjs reproduce

      - name: Secret scan bundle
        run: python3 scripts/secret-scan.py --root dist/sunrey-audit
