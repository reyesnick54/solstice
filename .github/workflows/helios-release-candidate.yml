# HELIOS H34 — release candidate packaging and qualification.
# Builds immutable evidence only. Does NOT deploy or authorize live finance.
name: HELIOS release candidate

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact commit SHA to qualify (defaults to workflow ref)
        required: false
        type: string
  pull_request:
    paths:
      - "packages/platform/src/helios/release-packaging/**"
      - "scripts/helios-h34-release-package.mjs"
      - "tests/helios-h34-release-packaging.test.ts"
      - "deploy/sunrey-sandbox-hetzner/**"
      - "db/**"
      - ".github/workflows/helios-release-candidate.yml"
  push:
    branches:
      - main
    paths:
      - "packages/platform/src/helios/release-packaging/**"
      - "scripts/helios-h34-release-package.mjs"
      - "tests/helios-h34-release-packaging.test.ts"
      - "deploy/sunrey-sandbox-hetzner/**"
      - "db/**"
      - ".github/workflows/helios-release-candidate.yml"

permissions:
  contents: read

jobs:
  qualify:
    name: BUILD → QUALIFY → MANIFEST
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solstice_bootstrap
          POSTGRES_PASSWORD: solstice_dev_only_not_for_production
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solstice_bootstrap -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SUNREY_PG_HOST: 127.0.0.1
      SUNREY_PG_PORT: "5432"
      SUNREY_PERSISTENCE_TEST: "1"
      GITHUB_WORKFLOW: ${{ github.workflow }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.git_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Architecture and safety checks
        run: |
          node scripts/check-json-integrity.mjs
          node scripts/check-merge-integrity.mjs
          node scripts/check-production-safety.mjs
          python3 scripts/check-deployment-posture.py
          npm run lint:architecture
          npm run gate

      - name: Typecheck
        run: node scripts/typecheck-regression-gate.mjs

      - name: Supply chain evidence
        run: |
          node scripts/sunrey-release.mjs audit
          node scripts/sunrey-release.mjs sbom
          node scripts/sunrey-release.mjs provenance

      - name: HELIOS H34 release package qualification
        run: npm run helios:h34:release-package

      - name: Full repository regression
        run: npm test

      - name: Upload release evidence
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: helios-h34-release-evidence
          if-no-files-found: warn
          path: |
            release/helios-release-manifest.json
            release/helios-h34-evidence.json
            dist/sunrey-supply-chain/
