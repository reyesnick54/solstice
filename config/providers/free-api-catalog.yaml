    description: Official U.S. macroeconomic time series from the Federal Reserve Bank of St. Louis including GDP, CPI,
      unemployment, and interest rates.
    primary_category: macroeconomics
    capabilities:
      - macroeconomic_indicators
      - economic_indicators
      - inflation
      - employment
      - interest_rates
      - gdp
    endpoints:
      base_url: https://api.stlouisfed.org/fred
      api_version: v1
      documentation_url: https://fred.stlouisfed.org/docs/api/fred/
      status_url: https://fred.stlouisfed.org/
    authentication:
      type: api_key
      required: true
      registration_required: true
      environment_variable: FRED_API_KEY
