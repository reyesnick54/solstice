SPECIFICATION Spec
CONSTANTS
  Validators = {V1, V2, V3}
  MaxHeight = 1
  MaxRound = 1
  Values = {A, NIL}
INVARIANTS
  NoConflictingFinalized
  FinalizedHeightMonotonic
  NilDoesNotCommit
  LockPreservesSafety
SYMMETRY
  Permutations(Validators)
\* FORMAL_SMOKE: 3 honest validators, 1 height, 1 extra round.
\* Bounded checking does not prove unlimited-state correctness.
