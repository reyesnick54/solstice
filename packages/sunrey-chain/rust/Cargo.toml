[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/crypto",
  "crates/state",
  "crates/execution",
  "crates/storage",
  "crates/governance",
  "crates/productive",
  "crates/oracle",
  "crates/fees",
  "crates/consensus",
  "crates/node",
  "crates/rpc",
  "crates/validators",
  "crates/native-assets",
  "crates/interop",
  "crates/wallet",
  "crates/ops",
  "crates/sdk",
  "crates/assurance",
  "crates/formal",
  "crates/provider-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
sunrey-protocol = { path = "crates/protocol" }
sunrey-crypto = { path = "crates/crypto" }
sunrey-state = { path = "crates/state" }
sunrey-execution = { path = "crates/execution" }
sunrey-storage = { path = "crates/storage" }
sunrey-consensus = { path = "crates/consensus" }
sunrey-node = { path = "crates/node" }
sunrey-rpc = { path = "crates/rpc" }
sunrey-governance = { path = "crates/governance" }
sunrey-productive = { path = "crates/productive" }
sunrey-oracle = { path = "crates/oracle" }
sunrey-fees = { path = "crates/fees" }
sunrey-validators = { path = "crates/validators" }
sunrey-native-assets = { path = "crates/native-assets" }
sunrey-interop = { path = "crates/interop" }
sunrey-wallet = { path = "crates/wallet" }
sunrey-ops = { path = "crates/ops" }
sunrey-sdk = { path = "crates/sdk" }
sunrey-assurance = { path = "crates/assurance" }
sunrey-formal = { path = "crates/formal" }
sunrey-provider-runtime = { path = "crates/provider-runtime" }
hex = "0.4.3"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "=0.10.8"
ed25519-dalek = "=2.1.1"
thiserror = "1.0.69"
clap = { version = "=4.5.23", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
base64ct = "=1.6.0"
zeroize = "=1.8.1"
redb = "=2.4.0"
