[package]
name = "sunrey-chain-node"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "SunRey development node internals: P2P, mempool, gossip, and state sync"
publish = false

[lib]
name = "sunrey_chain_node"
path = "src/lib.rs"

[[bin]]
name = "sunrey-node"
path = "src/bin/sunrey-node.rs"

[[bin]]
name = "sunrey-devnet"
path = "src/bin/sunrey-devnet.rs"

[[bin]]
name = "sunrey-accountability-demo"
path = "src/bin/sunrey-accountability-demo.rs"

[[bin]]
name = "sunrey-validator-devnet"
path = "src/bin/sunrey-validator-devnet.rs"

[[bin]]
name = "sunrey-validator-node"
path = "src/bin/sunrey-validator-node.rs"

[dependencies]
clap = { version = "=4.5.23", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
parking_lot = "0.12"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
