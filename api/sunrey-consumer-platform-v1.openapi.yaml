openapi: 3.1.0
info:
  title: SunRey consumer platform API
  version: v1
  description: >
    Canonical consumer/platform HTTP contract for frontend and Lovable
    integration. Documents implemented Phase B plus Phase C sandbox money
    endpoints. Specialized chain, Exchange, developer-platform, event, and
    webhook contracts remain in their own specifications. Simulation only.
    Balances are ledger projections. Clients never write the ledger, choose
    exchange rates, or treat Agent text as authorization.
servers:
  - url: http://127.0.0.1:18580
    description: Local consumer platform (not hardcoded in the SDK)
tags:
  - name: HEALTH
  - name: AUTH
  - name: SESSIONS
  - name: DEVICES
  - name: ME
  - name: HOME
  - name: ACCOUNTS
  - name: ACTIVITY
  - name: CAPABILITIES
  - name: ACTIONS
  - name: APPROVALS
  - name: WORKFLOWS
  - name: WEBHOOKS
  - name: SANDBOX
  - name: TRANSFERS
  - name: RECIPIENTS
  - name: PAYMENTS
  - name: FX
  - name: CARDS
security:
  - ConsumerBearer: []
paths:
  /health:
    get:
      operationId: getConsumerHealthRoot
      tags: [HEALTH]
      security: []
      summary: Process health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthDto" }
              example:
                status: ok
                api_version: v1
                surface: CONSUMER_PLATFORM
                environment: simulation
                production_active: false
  /ready:
    get:
      operationId: getConsumerReady
      tags: [HEALTH]
      security: []
      summary: Readiness
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthDto" }
  /v1/consumer/health:
    get:
      operationId: getConsumerHealth
      tags: [HEALTH]
      security: []
      summary: Versioned health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthDto" }
  /v1/consumer/version:
    get:
      operationId: getConsumerVersion
      tags: [HEALTH]
      security: []
      summary: API version and integration environment
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionDto" }
              example:
                api_version: v1
                product: SunRey consumer platform
                integration_environment: LOCAL
  /v1/consumer/auth/register:
    post:
      operationId: registerConsumerIdentity
      tags: [AUTH]
      security: []
      summary: Create and activate a person identity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
            example:
              home_jurisdiction: GB
      responses:
        "200":
          description: Identity created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "400":
          $ref: "#/components/responses/Error"
  /v1/consumer/auth/passkey/register/begin:
    post:
      operationId: beginConsumerPasskeyRegistration
      tags: [AUTH]
      security: []
      summary: Begin passkey registration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityIdRequest" }
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyChallengeDto" }
        "400":
          $ref: "#/components/responses/Error"
  /v1/consumer/auth/passkey/register/complete:
    post:
      operationId: completeConsumerPasskeyRegistration
      tags: [AUTH]
      security: []
      summary: Complete passkey registration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyRegisterCompleteRequest" }
            example:
              challenge_id: chal_example
              credential_id: cred_example
              public_key_material: sim-public-material
              transports: [internal]
              device_ref: browser-1
      responses:
        "200":
          description: Credential registered
        "401":
          $ref: "#/components/responses/Error"
  /v1/consumer/auth/passkey/login/begin:
    post:
      operationId: beginConsumerPasskeyLogin
      tags: [AUTH]
      security: []
      summary: Begin passkey login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityIdRequest" }
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyChallengeDto" }
  /v1/consumer/auth/passkey/login/complete:
    post:
      operationId: completeConsumerPasskeyLogin
      tags: [AUTH]
      security: []
      summary: Complete passkey login and issue a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyLoginCompleteRequest" }
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401":
          $ref: "#/components/responses/Error"
  /v1/consumer/auth/refresh:
    post:
      operationId: refreshConsumerSession
      tags: [AUTH]
      summary: Re-issue an access token while the session is active
      responses:
        "200":
          description: Refreshed token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401":
          $ref: "#/components/responses/Error"
  /v1/consumer/auth/logout:
    post:
      operationId: logoutConsumerSession
      tags: [AUTH]
      summary: Revoke the current session
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean, enum: [true] }
        "401":
          $ref: "#/components/responses/Error"
  /v1/consumer/auth/recovery:
    post:
      operationId: requestConsumerRecovery
      tags: [AUTH]
      security: []
      summary: Start account recovery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityIdRequest" }
      responses:
        "200":
          description: Recovery requested
  /v1/consumer/auth/mfa:
    get:
      operationId: getConsumerMfaStatus
      tags: [AUTH]
      summary: MFA factor status. TOTP is not implemented.
      responses:
        "200":
          description: MFA status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaStatusDto" }
  /v1/consumer/auth/sandbox/personas:
    get:
      operationId: listSandboxPersonas
      tags: [SANDBOX]
      security: []
      summary: List fail-closed sandbox personas
      description: Requires SUNREY_SANDBOX_PERSONAS=1 and ENVIRONMENT=simulation.
      responses:
        "200":
          description: Personas
        "403":
          $ref: "#/components/responses/Error"
  /v1/consumer/auth/sandbox/personas/{personaId}/session:
    post:
      operationId: loginSandboxPersona
      tags: [SANDBOX]
      security: []
      summary: Create a session for a sandbox persona
      parameters:
        - $ref: "#/components/parameters/personaId"
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "403":
          $ref: "#/components/responses/Error"
  /v1/consumer/auth/sandbox/expire-session:
    post:
      operationId: expireSandboxSession
      tags: [SANDBOX]
      summary: Expire the current session for harness tests
      responses:
        "200":
          description: Expired
        "403":
          $ref: "#/components/responses/Error"
  /v1/consumer/sessions:
    get:
      operationId: listConsumerSessions
      tags: [SESSIONS]
      summary: List sessions for the authenticated identity
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
  /v1/consumer/sessions/{sessionId}:
    delete:
      operationId: revokeConsumerSession
      tags: [SESSIONS]
      summary: Revoke a session
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Revoked
        "404":
          $ref: "#/components/responses/Error"
  /v1/consumer/devices:
    get:
      operationId: listConsumerDevices
      tags: [DEVICES]
      summary: List registered devices
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
  /v1/consumer/devices/{deviceId}/trust:
    post:
      operationId: setConsumerDeviceTrust
      tags: [DEVICES]
      summary: Update device trust
      parameters:
        - $ref: "#/components/parameters/deviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceTrustRequest" }
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDto" }
  /v1/consumer/me:
    get:
      operationId: getConsumerMe
      tags: [ME]
      summary: Current actor
      responses:
        "200":
          description: Me
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeDto" }
  /v1/consumer/bootstrap:
    get:
      operationId: getConsumerBootstrap
      tags: [HOME]
      summary: Client bootstrap contract
      responses:
        "200":
          description: Bootstrap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapDto" }
  /v1/consumer/home:
    get:
      operationId: getConsumerHome
      tags: [HOME]
      summary: Home screen contract
      responses:
        "200":
          description: Home
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeDto" }
  /v1/consumer/accounts:
    get:
      operationId: listConsumerAccounts
      tags: [ACCOUNTS]
      summary: List customer accounts with ledger balances
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Account page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountPage" }
        "403":
          $ref: "#/components/responses/Error"
  /v1/consumer/accounts/{accountId}:
    get:
      operationId: getConsumerAccount
      tags: [ACCOUNTS]
      summary: Read one account. Balance is a ledger projection.
      parameters:
        - $ref: "#/components/parameters/accountId"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDto" }
        "404":
          $ref: "#/components/responses/Error"
  /v1/consumer/activity:
    get:
      operationId: listConsumerActivity
      tags: [ACTIVITY]
      summary: Paginated activity
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityPage" }
  /v1/consumer/capabilities:
    get:
      operationId: listConsumerCapabilities
      tags: [CAPABILITIES]
      summary: Server-derived capabilities. Clients must not invent grants.
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityList" }
  /v1/consumer/features/{featureId}:
    get:
      operationId: getConsumerFeature
      tags: [CAPABILITIES]
      summary: Feature availability. Disabled features return FEATURE_UNAVAILABLE.
      parameters:
        - $ref: "#/components/parameters/featureId"
      responses:
        "200":
          description: Feature enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlagDto" }
        "403":
          $ref: "#/components/responses/Error"
  /v1/consumer/actions:
    post:
      operationId: submitConsumerAction
      tags: [ACTIONS]
      summary: Submit an implemented action through Kernel
      description: >
        Implemented action_type is OPEN_ACCOUNT only. The handler submits an
        ActionIntent to services/accounts. Kernel refusals are returned
        unchanged. Execution Authority is never issued by this API.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
        - $ref: "#/components/parameters/requestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
            example:
              action_type: OPEN_ACCOUNT
              idempotency_key: open-demo-1
              account_id: acct_demo_1
      responses:
        "200":
          description: Kernel ALLOW and account opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionDecisionDto" }
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/consumer/actions/{actionId}:
    get:
      operationId: getConsumerAction
      tags: [ACTIONS]
      parameters:
        - $ref: "#/components/parameters/actionId"
      responses:
        "200":
          description: Action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionDecisionDto" }
  /v1/consumer/approvals:
    get:
      operationId: listConsumerApprovals
      tags: [APPROVALS]
      summary: Pending Kernel review states
      responses:
        "200":
          description: Approvals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalList" }
  /v1/consumer/approvals/{approvalId}:
    get:
      operationId: getConsumerApproval
      tags: [APPROVALS]
      parameters:
        - $ref: "#/components/parameters/approvalId"
      responses:
        "200":
          description: Approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalDto" }
  /v1/consumer/approvals/{approvalId}/acknowledge:
    post:
      operationId: acknowledgeConsumerApproval
      tags: [APPROVALS]
      parameters:
        - $ref: "#/components/parameters/approvalId"
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalDto" }
  /v1/consumer/jobs/{jobId}:
    get:
      operationId: getConsumerJob
      tags: [WORKFLOWS]
      parameters:
        - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDto" }
  /v1/consumer/webhooks:
    get:
      operationId: listConsumerWebhooks
      tags: [WEBHOOKS]
      summary: List consumer webhook endpoints
      responses:
        "200":
          description: Endpoints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookList" }
    post:
      operationId: createConsumerWebhook
      tags: [WEBHOOKS]
      summary: Register a simulation webhook. Hosts other than localhost are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCreateRequest" }
            example:
              url: http://127.0.0.1:9/hooks
              event_types: [consumer.action.completed]
      responses:
        "200":
          description: Endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointDto" }
  /v1/consumer/webhooks/{endpointId}/test:
    post:
      operationId: testConsumerWebhook
      tags: [WEBHOOKS]
      parameters:
        - $ref: "#/components/parameters/endpointId"
      responses:
        "200":
          description: Delivery job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDto" }
  /v1/consumer/transfers:
    post:
      operationId: createConsumerTransfer
      tags: [TRANSFERS]
      summary: Internal transfer between the caller's accounts
      description: >
        Submits INTERNAL_TRANSFER through Kernel. The client never posts a
        journal. Simulation only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
            example:
              source_account_id: acct_fin-ready_usd
              destination_account_id: acct_fin-ready_sar
              amount: { minor_units: "1000", currency: USD }
              idempotency_key: xfer-demo-1
      responses:
        "200":
          description: Transfer posted after Kernel ALLOW
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferDto" }
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/consumer/recipients:
    get:
      operationId: listConsumerRecipients
      tags: [RECIPIENTS]
      summary: List saved recipients (beneficiaries)
      responses:
        "200":
          description: Recipients
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipientList" }
    post:
      operationId: createConsumerRecipient
      tags: [RECIPIENTS]
      summary: Create a recipient. Requires MANAGE_BENEFICIARY.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipientCreateRequest" }
            example:
              legal_name: Ahmed Ali
              destination_country: SA
              currency: SAR
              account_coordinate: SA0380000000608010167519
              idempotency_key: recip-demo-1
      responses:
        "200":
          description: Recipient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipientDto" }
        "403":
          $ref: "#/components/responses/Error"
  /v1/consumer/payments/quotes:
    post:
      operationId: createConsumerPaymentQuote
      tags: [PAYMENTS]
      summary: Quote an outbound payment. Rate is server-owned simulation reference.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FxQuoteRequest" }
            example:
              source_currency: USD
              destination_currency: SAR
              amount: { minor_units: "100000", currency: USD }
              corridor_id: US-SA-USD-SAR
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxQuoteDto" }
        "403":
          $ref: "#/components/responses/Error"
  /v1/consumer/payments:
    post:
      operationId: submitConsumerPayment
      tags: [PAYMENTS]
      summary: Submit a quoted sandbox payment
      description: >
        Accepts the quote and initiates the payment. Status is observed with
        GET. Clients cannot choose rates or self-approve restricted payments.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentSubmitRequest" }
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentDto" }
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/consumer/payments/{paymentId}:
    get:
      operationId: getConsumerPayment
      tags: [PAYMENTS]
      summary: Payment status. Pending and failed are first-class states.
      parameters:
        - $ref: "#/components/parameters/paymentId"
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentDto" }
        "404":
          $ref: "#/components/responses/Error"
  /v1/consumer/fx/quotes:
    post:
      operationId: createConsumerFxQuote
      tags: [FX]
      summary: Request a USD→SAR (or reverse) FX quote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FxQuoteRequest" }
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxQuoteDto" }
        "403":
          $ref: "#/components/responses/Error"
  /v1/consumer/fx/quotes/{quoteId}/accept:
    post:
      operationId: acceptConsumerFxQuote
      tags: [FX]
      summary: Accept a server-issued FX quote
      parameters:
        - $ref: "#/components/parameters/quoteId"
      responses:
        "200":
          description: Accepted quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxQuoteDto" }
        "409":
          $ref: "#/components/responses/Error"
  /v1/consumer/fx/quotes/{quoteId}/execute:
    post:
      operationId: executeConsumerFxQuote
      tags: [FX]
      summary: Execute an accepted FX conversion onto a destination account
      parameters:
        - $ref: "#/components/parameters/quoteId"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FxExecuteRequest" }
      responses:
        "200":
          description: Executed quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxQuoteDto" }
        "409":
          $ref: "#/components/responses/Error"
  /v1/consumer/cards:
    get:
      operationId: listConsumerCards
      tags: [CARDS]
      summary: List the caller's simulated cards
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardList" }
    post:
      operationId: issueConsumerCard
      tags: [CARDS]
      summary: Issue and activate a simulated virtual card
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardIssueRequest" }
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardDto" }
        "403":
          $ref: "#/components/responses/Error"
  /v1/consumer/cards/{cardId}/freeze:
    post:
      operationId: freezeConsumerCard
      tags: [CARDS]
      summary: Freeze a simulated card
      parameters:
        - $ref: "#/components/parameters/cardId"
      responses:
        "200":
          description: Frozen card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardDto" }
        "409":
          $ref: "#/components/responses/Error"
  /v1/consumer/cards/{cardId}/unfreeze:
    post:
      operationId: unfreezeConsumerCard
      tags: [CARDS]
      summary: Unfreeze a simulated card
      parameters:
        - $ref: "#/components/parameters/cardId"
      responses:
        "200":
          description: Active card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardDto" }
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    ConsumerBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
      description: Opaque access token from login or sandbox persona session. Not an Execution Authority.
  parameters:
    requestId:
      in: header
      name: X-Request-Id
      schema: { type: string }
    idempotencyKey:
      in: header
      name: Idempotency-Key
      schema: { type: string }
    cursor:
      in: query
      name: cursor
      schema: { type: string }
    pageSize:
      in: query
      name: page_size
      schema: { type: integer, minimum: 1, maximum: 100 }
    personaId:
      in: path
      name: personaId
      required: true
      schema:
        type: string
        enum: [alex-ready, blair-restricted, casey-capable, drew-empty, evan-paged, fin-ready]
    sessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string }
    deviceId:
      in: path
      name: deviceId
      required: true
      schema: { type: string }
    accountId:
      in: path
      name: accountId
      required: true
      schema: { type: string }
    featureId:
      in: path
      name: featureId
      required: true
      schema:
        type: string
        enum: [home, accounts, activity, capabilities, approvals, webhooks, investments, cards, exchange_trading, send, recipients, fx]
    actionId:
      in: path
      name: actionId
      required: true
      schema: { type: string }
    approvalId:
      in: path
      name: approvalId
      required: true
      schema: { type: string }
    jobId:
      in: path
      name: jobId
      required: true
      schema: { type: string }
    endpointId:
      in: path
      name: endpointId
      required: true
      schema: { type: string }
    paymentId:
      in: path
      name: paymentId
      required: true
      schema: { type: string }
    quoteId:
      in: path
      name: quoteId
      required: true
      schema: { type: string }
    cardId:
      in: path
      name: cardId
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Stable consumer error envelope
      headers:
        X-Request-Id:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error_code: AUTH_REQUIRED
            category: AUTHENTICATION
            message: authentication is required
            retryable: false
            user_action_required: true
            safe_to_display: true
            details_safe_for_client: {}
            request_id: req_example
            api_version: v1
  schemas:
    ErrorEnvelope:
      type: object
      required: [error_code, category, message, retryable, user_action_required, safe_to_display, details_safe_for_client, request_id, api_version]
      properties:
        error_code:
          type: string
          enum:
            - AUTH_REQUIRED
            - INVALID_CREDENTIALS
            - SESSION_EXPIRED
            - SESSION_REVOKED
            - MFA_REQUIRED
            - PASSKEY_CHALLENGE_INVALID
            - DEVICE_NOT_TRUSTED
            - DEVICE_BLOCKED
            - RECOVERY_REQUIRED
            - CAPABILITY_DENIED
            - FEATURE_UNAVAILABLE
            - KERNEL_REFUSED
            - VALIDATION_FAILED
            - INVALID_PAGINATION_CURSOR
            - PAGE_SIZE_EXCEEDED
            - IDEMPOTENCY_CONFLICT
            - POLICY_DENIED
            - COMPLIANCE_HOLD
            - APPROVAL_REQUIRED
            - APPROVAL_PENDING
            - APPROVAL_NOT_FOUND
            - RESOURCE_NOT_FOUND
            - RESOURCE_CONFLICT
            - RATE_LIMITED
            - PROVIDER_UNAVAILABLE
            - WORKFLOW_FAILED
            - SANDBOX_PERSONA_FORBIDDEN
            - OVERSIZED_REQUEST
            - INTERNAL_ERROR
        category:
          type: string
          enum: [AUTHENTICATION, AUTHORIZATION, VALIDATION, POLICY, COMPLIANCE, APPROVAL, RESOURCE, CONFLICT, RATE_LIMIT, PROVIDER, WORKFLOW, INTERNAL]
        message: { type: string }
        retryable: { type: boolean }
        user_action_required: { type: boolean }
        safe_to_display: { type: boolean }
        details_safe_for_client:
          type: object
          additionalProperties: { type: string }
        request_id: { type: string }
        api_version: { type: string, enum: [v1] }
    HealthDto:
      type: object
      required: [status, api_version, surface, environment, production_active]
      properties:
        status: { type: string, enum: [ok] }
        api_version: { type: string, enum: [v1] }
        surface: { type: string, enum: [CONSUMER_PLATFORM] }
        environment: { type: string, enum: [simulation] }
        production_active: { type: boolean, enum: [false] }
    VersionDto:
      type: object
      required: [api_version, product, integration_environment]
      properties:
        api_version: { type: string, enum: [v1] }
        product: { type: string }
        integration_environment:
          type: string
          enum: [LOCAL, TEST, SANDBOX, STAGING, PREPRODUCTION, PRODUCTION]
    RegisterRequest:
      type: object
      properties:
        home_jurisdiction: { type: string }
    RegisterResponse:
      type: object
      required: [identity_id, status, next_step]
      properties:
        identity_id: { type: string }
        status: { type: string, enum: [ACTIVE] }
        next_step: { type: string, enum: [PASSKEY_REGISTER] }
    IdentityIdRequest:
      type: object
      required: [identity_id]
      properties:
        identity_id: { type: string }
    PasskeyChallengeDto:
      type: object
      required: [challenge_id, challenge, rp_id, origin, expires_at]
      properties:
        challenge_id: { type: string }
        challenge: { type: string }
        rp_id: { type: string }
        origin: { type: string }
        expires_at: { type: string }
    PasskeyRegisterCompleteRequest:
      type: object
      required: [challenge_id, credential_id, public_key_material, transports]
      properties:
        challenge_id: { type: string }
        credential_id: { type: string }
        public_key_material: { type: string }
        transports:
          type: array
          items: { type: string }
        device_ref: { type: string }
    PasskeyLoginCompleteRequest:
      type: object
      required: [challenge_id, credential_id, authenticator_data, client_data_json, signature, sign_count, actor_id]
      properties:
        challenge_id: { type: string }
        credential_id: { type: string }
        authenticator_data: { type: string }
        client_data_json: { type: string }
        signature: { type: string }
        sign_count: { type: integer }
        actor_id: { type: string }
        device_ref: { type: string }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, session, api_version]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        session: { $ref: "#/components/schemas/SessionDto" }
        api_version: { type: string, enum: [v1] }
    SessionDto:
      type: object
      required: [session_id, actor_id, identity_id, expires_at, device_id, assurance, revocation_state]
      properties:
        session_id: { type: string }
        actor_id: { type: string }
        identity_id: { type: string }
        expires_at: { type: string }
        device_id: { type: string, nullable: true }
        assurance: { type: string }
        revocation_state: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] }
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionDto" }
    MfaStatusDto:
      type: object
      required: [factors, totp_enrolled, passkey_available]
      properties:
        factors:
          type: array
          items: { type: string }
        totp_enrolled: { type: boolean, enum: [false] }
        passkey_available: { type: boolean }
    DeviceDto:
      type: object
      required: [device_id, device_ref, trust_state, last_seen_at]
      properties:
        device_id: { type: string }
        device_ref: { type: string }
        trust_state: { type: string, enum: [KNOWN, TRUSTED, REVIEW_REQUIRED, BLOCKED] }
        last_seen_at: { type: string }
    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeviceDto" }
    DeviceTrustRequest:
      type: object
      required: [trust_state]
      properties:
        trust_state: { type: string, enum: [KNOWN, TRUSTED, REVIEW_REQUIRED, BLOCKED] }
    MeDto:
      type: object
      required: [actor_id, identity_id, customer_id, assurance, jurisdiction]
      properties:
        actor_id: { type: string }
        identity_id: { type: string }
        customer_id: { type: string, nullable: true }
        assurance: { type: string }
        jurisdiction: { type: string, nullable: true }
    MoneyDto:
      type: object
      required: [minor_units, currency]
      properties:
        minor_units: { type: string, description: Integer minor units as a decimal string. Never a float. }
        currency: { type: string }
    PositionBreakdownDto:
