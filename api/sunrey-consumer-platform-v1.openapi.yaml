          type: string
          enum: [LOCAL, TEST, SANDBOX, STAGING, PREPRODUCTION, PRODUCTION]
        environment: { type: string, enum: [simulation] }
        production_ready: { type: boolean, enum: [false] }
        production_active: { type: boolean, enum: [false] }
        live_connectivity_enabled: { type: boolean, enum: [false] }
        me: { $ref: "#/components/schemas/MeDto" }
        session: { $ref: "#/components/schemas/SessionDto" }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/CapabilityDto" }
        features:
          type: array
          items: { $ref: "#/components/schemas/FeatureFlagDto" }
        degraded:
