openapi: 3.1.0
info:
  title: SunRey Consumer Backend-for-Frontend
  version: v1
  description: >
    Lovable / mobile / responsive-web orchestration API.
    Not a ledger, Exchange, Agent runtime, Kernel, or payment processor.
    Financial fields are integer minor-unit strings. Production remains disabled.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/me:
    get:
      operationId: getMe
      summary: Get the authenticated customer profile
      responses:
        "200":
          description: Controlled profile
        "401":
          description: Authentication required
    patch:
      operationId: patchMe
      summary: Update authorized preference fields only
      description: KYC and legal-identity fields are rejected.
      responses:
        "200":
          description: Updated profile
        "403":
          description: Forbidden profile field
  /api/v1/me/home:
    get:
      operationId: getMeHome
      summary: Home aggregation contract
      parameters:
        - in: query
          name: valuationCurrency
          required: false
          schema: { type: string, minLength: 3, maxLength: 3 }
          description: Explicit valuation currency. Different currencies are never summed without FX.
      responses:
        "200":
          description: Home resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeResource" }
  /api/v1/me/bootstrap:
    get:
      operationId: getMeBootstrap
      summary: Authenticated frontend bootstrap
      responses:
        "200":
          description: Bootstrap resource
  /api/v1/me/capabilities:
    get:
      operationId: getMeCapabilities
      summary: Server-computed feature capabilities
      responses:
        "200":
          description: Capability map
  /api/v1/me/actions:
    get:
      operationId: getMeActions
      summary: Pending regulated actions
      responses:
        "200":
          description: Action status list
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: List customer accounts
      responses:
        "200":
          description: Account read models
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConsumerAccount" }
  /api/v1/accounts/{id}:
    get:
      operationId: getAccount
      summary: Get one owned account
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Account read model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerAccount" }
        "403":
          description: Resource not owned
  /api/v1/accounts/{id}/activity:
    get:
      operationId: getAccountActivity
      summary: Cursor-paginated account activity
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque pagination cursor
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, PROCESSING, COMPLETED, FAILED, REVERSED, CANCELLED, ACTION_REQUIRED]
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: currency
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityPage" }
        "400":
          description: Invalid filter or cursor
  /api/v1/accounts/{id}/statement:
    get:
      operationId: getAccountStatement
      summary: Authoritative statement data for a period
      description: Opening and closing balances are derived from the Ledger. No PDF renderer.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: periodStart
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: periodEnd
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Statement data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountStatement" }
        "400":
          description: Invalid period
        "403":
          description: Resource not owned
  /api/v1/catalog/resources:
    get:
      operationId: listConsumerResources
      summary: Consumer resource catalog
      responses:
        "200":
          description: Resource descriptors
  /api/v1/catalog/enums:
    get:
      operationId: listConsumerEnums
      summary: Client-safe enumerations
      responses:
        "200":
          description: Enumerations
  /api/v1/sandbox/personas:
    get:
      operationId: listSandboxPersonas
      summary: Non-production sandbox personas
      responses:
        "200":
          description: Sandbox persona list
  /api/v1/payments:
    get:
      operationId: listPayments
      summary: List the authenticated customer's payments
      description: Backend owns authoritative status. Production money movement stays disabled.
      responses:
        "200":
          description: Payment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        "401":
          description: Authentication required
    post:
      operationId: createPayment
      summary: Create a payment from a quote or destination
      description: >
        Internal SunRey transfers settle atomically on the canonical Ledger.
        External rails stay simulation-only. Requires Idempotency-Key.
      responses:
        "200":
          description: Payment resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          description: Step-up or authentication required
        "403":
          description: Kernel refused or resource not owned
  /api/v1/payments/quote:
    post:
      operationId: quotePayment
      summary: Preview a payment without executing
      description: Does not promise settlement time. FX and rail fees are simulation-only.
      responses:
        "200":
          description: Payment quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentQuote"
        "401":
          description: Authentication required
  /api/v1/payments/{id}:
    get:
      operationId: getPayment
      summary: Get one owned payment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Payment resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "403":
          description: Resource not owned
        "404":
          description: Not found
  /api/v1/payments/{id}/approve:
    post:
      operationId: approvePayment
      summary: Approve a payment that is awaiting customer confirmation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "403":
          description: Resource not owned
        "404":
          description: Approval not found
  /api/v1/fx:
    get:
      operationId: getFx
      summary: FX availability catalog
      responses:
        "200":
          description: Honest availability
  /api/v1/fx/currencies:
    get:
      operationId: listFxCurrencies
      summary: Supported simulation currency metadata
      description: Metadata existence does not imply live deposit, withdrawal, or FX.
      responses:
        "200":
          description: Currency catalog
  /api/v1/fx/valuation:
    get:
      operationId: getFxValuation
      summary: Presentation-only multi-currency valuation
      description: Not Ledger accounting authority. Includes rate timestamps and stale indication.
      parameters:
        - name: targetCurrency
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Presentation valuation
  /api/v1/fx/quotes:
    post:
      operationId: createFxQuote
      summary: Request a server-priced FX quote
      description: >
        Client sends source amount and currencies only. The server applies
        rates, spread, and fees. Frontend must not implement FX math.
      responses:
        "201":
          description: Immutable quote
        "403":
          description: Kernel denied
  /api/v1/fx/quotes/{id}:
    get:
      operationId: getFxQuote
      summary: Read an issued FX quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quote
        "404":
          description: Not found
  /api/v1/fx/quotes/{id}/accept:
    post:
      operationId: acceptFxQuote
      summary: Approve the exact issued quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved quote
  /api/v1/fx/quotes/{id}/execute:
    post:
      operationId: executeFxQuote
      summary: Execute the exact approved quote
      description: Expired quotes cannot execute. Execution posts Ledger journals through Execution Authority.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Execution result
  /api/v1/cards:
    get:
      operationId: getCards
      summary: List simulated cards for the authenticated customer
      description: PCI-minimized. last4 and expiry only. No PAN, CVV, or provider credentials. Live issuing is not connected.
      responses:
        "200":
          description: Card list
    post:
      operationId: issueCard
      summary: Request a simulated virtual or physical debit card
      description: Kernel-gated. Requires step-up. Simulated issuer only.
      responses:
        "201":
          description: Issued card
        "403":
          description: Step-up or policy refusal
  /api/v1/cards/{id}:
    get:
      operationId: getCard
      summary: Card detail with funding available balance, controls, activity, and wallet status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Card detail
        "403":
          description: Resource not owned
  /api/v1/cards/{id}/freeze:
    post:
      operationId: freezeCard
      summary: Freeze a card
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Frozen card
  /api/v1/cards/{id}/unfreeze:
    post:
      operationId: unfreezeCard
      summary: Unfreeze a card
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Active card
  /api/v1/cards/{id}/controls:
    patch:
      operationId: patchCardControls
      summary: Update server-enforced spending controls
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated card
  /api/v1/cards/{id}/wallet:
    get:
      operationId: getCardWallet
      summary: Apple/Google wallet provisioning eligibility and status
      description: Not Apple Pay or Google Pay certification.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Wallet status
  /api/v1/webhooks/cards:
    post:
      operationId: ingestCardWebhook
      summary: Simulated card processor webhook ingestion
      description: Phase B HMAC verification. Real schemes arrive in Phase D.
      responses:
        "200":
          description: Ingest result
  /api/v1/grow:
    get:
      operationId: getGrow
      summary: Grow My Money home
      description: Structured Grow home. Lovable only renders server state.
      responses:
        "200":
          description: Grow home
  /api/v1/grow/snapshot:
    get:
      operationId: getGrowSnapshot
      summary: Financial snapshot from the Personal Economic Graph
      responses:
        "200":
          description: Snapshot
  /api/v1/grow/goals:
    get:
      operationId: listGrowGoals
      summary: List financial goals
      responses:
        "200":
          description: Goals
    post:
      operationId: createGrowGoal
      summary: Create a financial goal
      responses:
        "201":
          description: Goal
  /api/v1/grow/opportunities:
    get:
      operationId: listGrowOpportunities
      summary: List opportunities
      responses:
        "200":
          description: Opportunities
  /api/v1/grow/opportunities/{id}/dismiss:
    post:
      operationId: dismissGrowOpportunity
      summary: Dismiss an opportunity
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dismissed
  /api/v1/grow/plan:
    get:
      operationId: getGrowthPlan
      summary: Current Growth Plan
      responses:
        "200":
          description: Plan
  /api/v1/grow/plan/request:
    post:
      operationId: requestNewGrowthPlan
      summary: Request a new Growth Plan
      responses:
        "200":
          description: Plan
  /api/v1/grow/plan/pause:
    post:
      operationId: pauseGrowthPlan
      summary: Pause an activated Growth Plan
      responses:
        "200":
          description: Paused
  /api/v1/grow/plan/resume:
    post:
      operationId: resumeGrowthPlan
      summary: Resume an activated Growth Plan
      responses:
        "200":
          description: Resumed
  /api/v1/grow/plan/progress:
    get:
      operationId: getGrowthPlanProgress
      summary: Activated plan component progress
      responses:
        "200":
          description: Progress
  /api/v1/grow/scenarios:
    get:
      operationId: getGrowScenarios
      summary: Scenario bands
      description: Projection and estimate only. Not guaranteed returns.
      responses:
        "200":
          description: Scenarios
  /api/v1/grow/proposals:
    post:
      operationId: createGrowthProposal
      summary: Create a server-owned Financial Proposal
      responses:
        "201":
          description: Proposal
  /api/v1/grow/proposals/{id}:
    get:
      operationId: getGrowthProposal
      summary: Proposal detail and explainability
      summary: Grow My Money catalog and latest plan experience
      description: >
        Simulation illustrations only. Conservative, base, and upside
        ranges are not guaranteed outcomes. Production remains disabled.
      responses:
        "200":
          description: Grow catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowCatalog"
  /api/v1/grow/plans:
    get:
      operationId: listGrowPlans
      summary: List the authenticated customer's growth plans
      responses:
        "200":
          description: Plan list
    post:
      operationId: createGrowPlan
      summary: Create a Grow My Money plan
      description: >
        Server issues the plan and a structured primary proposal.
        The client cannot submit proposal JSON as if the server issued it.
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowPlan"
  /api/v1/grow/plans/{id}:
    get:
      operationId: getGrowPlan
      summary: Get one owned growth plan
      summary: Grow My Money availability
      responses:
        "200":
          description: Honest availability
  /api/v1/grow/portfolio:
    get:
      operationId: getGrowPortfolio
      summary: Simulation portfolio summary
      description: >
        Authoritative values come from packages/investments.
        Frontend math is not authoritative. Not a live securities brokerage.
      responses:
        "200":
          description: Portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowPortfolio"
      summary: Grow My Money opportunity feed
      description: >
        Deterministic Growth Orchestrator cards. Does not execute money
        or promise a return.
      responses:
        "200":
          description: Opportunity feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowOpportunityFeed"
  /api/v1/grow/opportunities:
    get:
      operationId: listGrowOpportunities
      summary: List ranked growth opportunities
      responses:
        "200":
          description: Opportunity feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowOpportunityFeed"
        "401":
          description: Authentication required
        "403":
          description: Cross-user denied
        "404":
          description: Portfolio not found
  /api/v1/grow/portfolio/holdings:
    get:
      operationId: getGrowPortfolioHoldings
      summary: Simulation holdings
      responses:
        "200":
          description: Holdings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowHoldings"
  /api/v1/grow/portfolio/performance:
    get:
      operationId: getGrowPortfolioPerformance
      summary: Simulation performance
      description: Server-calculated TWR or Modified Dietz. LLMs are not authoritative.
      responses:
        "200":
          description: Performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowPerformance"
  /api/v1/grow/portfolio/allocation:
    get:
      operationId: getGrowPortfolioAllocation
      summary: Actual and target allocation
      responses:
        "200":
          description: Allocation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowAllocation"
  /api/v1/grow/portfolio/risk:
    get:
      operationId: getGrowPortfolioRisk
      summary: Portfolio risk metrics
      description: Does not fabricate statistics when history is insufficient.
      responses:
        "200":
          description: Risk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowRisk"
  /api/v1/grow/opportunities/{id}:
    get:
      operationId: getGrowOpportunity
      summary: Get one owned growth opportunity
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Growth plan
        "403":
          description: Cross-user denied
        "404":
          description: Unknown plan
  /api/v1/grow/proposals:
    get:
      operationId: listGrowProposals
      summary: List structured financial proposals
      responses:
        "200":
          description: Proposal list
    post:
      operationId: createGrowProposal
      summary: Create a structured financial proposal from a plan component
      responses:
        "201":
          description: Financial proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowProposal"
  /api/v1/grow/proposals/{id}:
    get:
      operationId: getGrowProposal
      summary: Get one owned financial proposal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Proposal
  /api/v1/grow/proposals/{id}/modify:
    post:
      operationId: modifyGrowthProposal
      summary: Create a new proposal version
          description: Financial proposal
        "404":
          description: Unknown or fabricated proposal id
  /api/v1/grow/proposals/{id}/modify:
    post:
      operationId: modifyGrowProposal
      summary: Recalculate a new proposal version
      description: Material terms on a presented proposal are not edited in place.
          description: Opportunity
        "403":
          description: Cross-user denied
        "404":
          description: Not found
  /api/v1/grow/opportunities/{id}/dismiss:
    post:
      operationId: dismissGrowOpportunity
      summary: Dismiss an opportunity
      description: A dismissed fingerprint is not re-presented unchanged.
      summary: Grow My Money catalog
      responses:
        "200":
          description: Availability plus simulation posture
  /api/v1/grow/profile:
    get:
      operationId: getGrowProfile
      summary: Client-safe financial intelligence profile
      description: >
        Derived from the Personal Economic Graph. Not the Ledger.
        Does not promise guaranteed returns. Unlike currencies are not summed.
      responses:
        "200":
          description: Grow profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowProfile"
  /api/v1/grow/snapshot:
    get:
      operationId: getGrowSnapshot
      summary: Financial snapshot
      responses:
        "200":
          description: Snapshot with per-currency positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowSnapshot"
  /api/v1/grow/goals:
    get:
      operationId: listGrowGoals
      summary: List user-declared goals
      responses:
        "200":
          description: Goal list
    post:
      operationId: createGrowGoal
      summary: Create a user-declared goal
      responses:
        "201":
          description: Created goal
  /api/v1/grow/goals/{id}:
    patch:
      operationId: patchGrowGoal
      summary: Update a user-declared goal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: New version
  /api/v1/grow/proposals/{id}/approve:
    post:
      operationId: approveGrowthProposal
      summary: Customer approval with step-up when required
          description: New proposal version
  /api/v1/grow/proposals/{id}/approve:
    post:
      operationId: approveGrowProposal
      summary: Approve a structured financial proposal
      description: >
        Uses the Phase B approval state machine. Approval does not issue
        Execution Authority and does not post a ledger journal.
          description: Dismissed opportunity
  /api/v1/grow/opportunities/{id}/start-proposal:
    post:
      operationId: startGrowOpportunityProposal
      summary: Accept an opportunity for proposal
      description: >
        Does not execute money, issue Execution Authority, or post a
        ledger journal.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approved
        "401":
          description: Step-up required
  /api/v1/grow/proposals/{id}/execute:
    post:
      operationId: executeGrowthProposal
      summary: Execute an approved proposal through Kernel and Provider Runtime
      description: Frontend financial instructions are not trusted proposal state.
          description: Approved proposal
        "401":
          description: Step-up required
        "403":
          description: Policy, suitability, or cross-user denial
  /api/v1/grow/proposals/{id}/reject:
    post:
      operationId: rejectGrowProposal
      summary: Reject a structured financial proposal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Execution
  /api/v1/grow/executions/{id}:
    get:
      operationId: getGrowExecution
      summary: Normalized execution status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Execution
  /api/v1/grow/portfolio:
    get:
      operationId: getGrowPortfolio
      summary: Holdings, allocation, and risk
      responses:
        "200":
          description: Portfolio
  /api/v1/grow/performance:
    get:
      operationId: getGrowPerformance
      summary: Planned versus executed versus current
      description: Deposits are not market performance.
      responses:
        "200":
          description: Performance
  /api/v1/grow/recurring:
    post:
      operationId: createGrowRecurring
      summary: Create a recurring contribution mandate
      responses:
        "201":
          description: Mandate
  /api/v1/grow/recurring/{id}/cancel:
    post:
      operationId: cancelGrowRecurring
      summary: Revoke a recurring mandate
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked
  /api/v1/grow/monitor:
    post:
      operationId: runGrowMonitor
      summary: Run a monitoring cycle
      responses:
        "200":
          description: Findings
  /api/v1/grow/agent-tools:
    post:
      operationId: invokeGrowAgentTool
      summary: Phase F agent tool hook
      description: Agent may propose. Agent cannot execute or self-approve.
      responses:
        "200":
          description: Tool result
        "403":
          description: Privileged execution refused
          description: Rejected proposal
          description: Proposal receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowProposalReceipt"
          description: Updated goal
  /api/v1/grow/insights:
    get:
      operationId: listGrowInsights
      summary: Deterministic derived insights
      responses:
        "200":
          description: Insight list
  /api/v1/grow/suitability:
    get:
      operationId: getGrowSuitability
      summary: Deterministic risk and suitability profile
      responses:
        "200":
          description: Suitability or null
    post:
      operationId: submitGrowSuitability
      summary: Submit questionnaire answers
      responses:
        "201":
          description: Assessed profile
  /api/v1/grow/assumptions:
    post:
      operationId: declareGrowAssumption
      summary: Declare or correct user-editable assumptions
      description: Cannot override Ledger-backed SunRey account balances.
      responses:
        "201":
          description: Accepted declaration
        "403":
          description: Authoritative fact immutable
  /api/v1/grow/classifications:
    post:
      operationId: correctGrowClassification
      summary: Correct a derived activity classification
      responses:
        "200":
          description: Overlay stored
  /api/v1/grow/history:
    get:
      operationId: getGrowHistory
      summary: Compact historical snapshot series
      responses:
        "200":
          description: History points
  /api/v1/grow/agent:
    get:
      operationId: getGrowAgentProfile
      summary: Agent-scoped PEG read
      description: An Agent does not automatically receive every personal category.
      responses:
        "200":
          description: Scoped profile
        "403":
          description: Mandate required
  /api/v1/agent:
    get:
      operationId: getAgent
      summary: Agent resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/agent/conversations:
    post:
      operationId: startAgentConversation
      summary: Start an Agent conversation
      description: Intent is routing metadata. The Agent cannot approve or execute.
      responses:
        "201":
          description: Conversation created
        "401":
          description: Authentication required
  /api/v1/agent/conversations/{id}/messages:
    post:
      operationId: sendAgentMessage
      summary: Send a conversational turn
      description: Missing financial fields are requested. Proposal JSON is server-issued.
      responses:
        "200":
          description: Conversation turn with optional Action Card
        "400":
          description: Policy refusal
  /api/v1/agent/conversations/{id}/events:
    get:
      operationId: streamAgentEvents
      summary: Conversation event cursor
      description: Status and tool progress. Lovable should not poll domain services.
      parameters:
        - in: query
          name: after
          schema:
            type: integer
      responses:
        "200":
          description: Incremental events
  /api/v1/agent/actions:
    get:
      operationId: listAgentActions
      summary: Agent Action Center
      parameters:
        - in: query
          name: view
          schema:
            type: string
            enum: [AWAITING_APPROVAL, PROCESSING, COMPLETED, REJECTED, EXPIRED, REQUIRES_ATTENTION]
      responses:
        "200":
          description: Action Center list
  /api/v1/agent/actions/{id}:
    get:
      operationId: getAgentAction
      summary: Action detail, explanation, and history
      responses:
        "200":
          description: Action detail
  /api/v1/agent/actions/{id}/approve:
    post:
      operationId: approveAgentAction
      summary: Human approval
      description: Requires authenticated human session. Step-up uses Phase B MFA/passkey.
      responses:
        "200":
          description: Approval and execution status
        "401":
          description: Step-up required
  /api/v1/agent/actions/{id}/modify:
    post:
      operationId: modifyAgentAction
      summary: Request a server-issued proposal revision
      responses:
        "200":
          description: New Action Card
  /api/v1/agent/actions/{id}/reject:
    post:
      operationId: rejectAgentAction
      summary: Reject a proposal
      responses:
        "200":
          description: Rejected action
  /api/v1/agent/tools:
    get:
      operationId: listAgentTools
      summary: Canonical Agent Tool catalog
      description: >
        Read-only catalog of approved Financial Agent tools.
        Frontend does not invoke privileged tools. The path is
        Lovable → Agent message API → Agent Runtime → Tool Runtime.
      responses:
        "200":
          description: Tool catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolCatalog"
  /api/v1/agents:
    get:
      operationId: listAgents
      summary: List Agents owned by the authenticated customer
      description: The Agent is an actor for the customer. It is not the customer and not Execution Authority.
      responses:
        "200":
          description: Agent list
        "401":
          description: Authentication required
  /api/v1/agents/{id}:
    get:
      operationId: getAgentById
      summary: Get one owned Agent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Agent identity
        "403":
          description: Cross-user denied
  /api/v1/agents/{id}/pause:
    post:
      operationId: pauseAgent
      summary: Owner pause
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Paused Agent
  /api/v1/agents/{id}/revoke:
    post:
      operationId: revokeAgent
      summary: Owner revoke
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked Agent
  /api/v1/agents/{id}/settings:
    get:
      operationId: getAgentSettings
      summary: Personalization settings
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Settings
    patch:
      operationId: patchAgentSettings
      summary: Update personalization that cannot alter financial mathematics
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Settings
  /api/v1/agents/{id}/permissions:
    get:
      operationId: getAgentPermissions
      summary: Mandate assist scopes and proposal limits
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Permissions
  /api/v1/agents/{id}/memories:
    get:
      operationId: listAgentMemories
      summary: List customer-visible Agent memories
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Memories
    post:
      operationId: createAgentMemory
      summary: Create a user-declared memory
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Memory
  /api/v1/agents/{id}/memories/{memoryId}:
    patch:
      operationId: correctAgentMemory
      summary: Correct a user-editable memory
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: memoryId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Corrected memory
    delete:
      operationId: deleteAgentMemory
      summary: Delete a user-editable memory
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: memoryId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
  /api/v1/agents/{id}/conversations:
    get:
      operationId: listAgentConversations
      summary: List conversations
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conversation list
    post:
      operationId: createAgentConversation
      summary: Create a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Conversation
  /api/v1/agents/{id}/conversations/{conversationId}:
    get:
      operationId: getAgentConversation
      summary: Get one conversation and its messages
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: conversationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conversation
        "403":
          description: Cross-user denied
  /api/v1/agents/{id}/conversations/{conversationId}/messages:
    post:
      operationId: postAgentMessage
      summary: Post a user message and receive a streamed Agent reply
      description: >
        Conversational state only. Tool calls that would mutate financial
        state are not executed because text generation requested them.
        Query stream=1 returns text/event-stream chunks.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: conversationId
          required: true
          schema: { type: string }
        - in: query
          name: stream
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Message plus stream chunks
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
  /api/v1/agent/conversations/{conversationId}/messages:
    post:
      operationId: postAgentConversationMessage
      summary: Agent conversation message (not a raw LLM endpoint)
      description: >
        Lovable calls Agent endpoints. The Agent runtime calls the Model
        Gateway. This route is not unrestricted model inference and cannot
        execute payments or post journals.
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Agent stream events or SSE
        "401":
          description: Authentication required
  /api/v1/exchange:
    get:
      operationId: getExchange
      summary: Exchange home for Lovable screens
      responses:
        "200":
          description: Exchange home, eligibility, and supported screens
  /api/v1/exchange/markets:
    get:
      operationId: listExchangeMarkets
