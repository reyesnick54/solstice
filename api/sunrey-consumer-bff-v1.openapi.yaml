openapi: 3.1.0
info:
  title: SunRey Consumer Backend-for-Frontend
  version: v1
  description: >
    Lovable / mobile / responsive-web orchestration API.
    Not a ledger, Exchange, Agent runtime, Kernel, or payment processor.
    Financial fields are integer minor-unit strings. Production remains disabled.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/me:
    get:
      operationId: getMe
      summary: Get the authenticated customer profile
      responses:
        "200":
          description: Controlled profile
        "401":
          description: Authentication required
    patch:
      operationId: patchMe
      summary: Update authorized preference fields only
      description: KYC and legal-identity fields are rejected.
      responses:
        "200":
          description: Updated profile
        "403":
          description: Forbidden profile field
  /api/v1/me/home:
    get:
      operationId: getMeHome
      summary: Home aggregation contract
      parameters:
        - in: query
          name: valuationCurrency
          required: false
          schema: { type: string, minLength: 3, maxLength: 3 }
          description: Explicit valuation currency. Different currencies are never summed without FX.
      responses:
        "200":
          description: Home resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeResource" }
  /api/v1/me/bootstrap:
    get:
      operationId: getMeBootstrap
      summary: Authenticated frontend bootstrap
      responses:
        "200":
          description: Bootstrap resource
  /api/v1/me/capabilities:
    get:
      operationId: getMeCapabilities
      summary: Server-computed feature capabilities
      responses:
        "200":
          description: Capability map
  /api/v1/me/actions:
    get:
      operationId: getMeActions
      summary: Pending regulated actions
      responses:
        "200":
          description: Action status list
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: List customer accounts
      responses:
        "200":
          description: Account read models
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConsumerAccount" }
  /api/v1/accounts/{id}:
    get:
      operationId: getAccount
      summary: Get one owned account
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Account read model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerAccount" }
        "403":
          description: Resource not owned
  /api/v1/accounts/{id}/activity:
    get:
      operationId: getAccountActivity
      summary: Cursor-paginated account activity
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque pagination cursor
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, PROCESSING, COMPLETED, FAILED, REVERSED, CANCELLED, ACTION_REQUIRED]
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: currency
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityPage" }
        "400":
          description: Invalid filter or cursor
  /api/v1/accounts/{id}/statement:
    get:
      operationId: getAccountStatement
      summary: Authoritative statement data for a period
      description: Opening and closing balances are derived from the Ledger. No PDF renderer.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: periodStart
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: periodEnd
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Statement data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountStatement" }
        "400":
          description: Invalid period
        "403":
          description: Resource not owned
  /api/v1/catalog/resources:
    get:
      operationId: listConsumerResources
      summary: Consumer resource catalog
      responses:
        "200":
          description: Resource descriptors
  /api/v1/catalog/enums:
    get:
      operationId: listConsumerEnums
      summary: Client-safe enumerations
      responses:
        "200":
          description: Enumerations
  /api/v1/sandbox/personas:
    get:
      operationId: listSandboxPersonas
      summary: Non-production sandbox personas
      responses:
        "200":
          description: Sandbox persona list
  /api/v1/payments:
    get:
      operationId: getPayments
      summary: Payments resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/fx:
    get:
      operationId: getFx
      summary: FX resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/cards:
    get:
      operationId: getCards
      summary: Cards resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/grow:
    get:
      operationId: getGrow
      summary: Grow My Money resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/agent:
    get:
      operationId: getAgent
      summary: Agent resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/exchange:
    get:
      operationId: getExchange
      summary: Exchange resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/recipients:
    get:
      operationId: getRecipients
      summary: Recipients resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/goals:
    get:
      operationId: getGoals
      summary: Goals resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/portfolio:
    get:
      operationId: getPortfolio
      summary: Portfolio resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/wallets:
    get:
      operationId: getWallets
      summary: Wallets resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/data:
    get:
      operationId: getDataVault
      summary: Data vault resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/security:
    get:
      operationId: getSecurity
      summary: Security resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/notifications:
    get:
      operationId: getNotifications
      summary: Notifications resource stub
      responses:
        "200":
          description: Honest availability
components:
  schemas:
    MoneyView:
      type: object
      required: [currency, minorUnits]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        minorUnits: { type: string, description: Integer minor units as a decimal string. Never floating-point. }
    AccountBalanceView:
      type: object
      required: [posted, ledger, available, held, pending, currency]
      properties:
        posted: { $ref: "#/components/schemas/MoneyView" }
        ledger: { $ref: "#/components/schemas/MoneyView" }
        available: { $ref: "#/components/schemas/MoneyView" }
        held: { $ref: "#/components/schemas/MoneyView" }
        pending: { $ref: "#/components/schemas/MoneyView" }
        currency: { type: string }
    ResourceField:
      type: object
      required: [state, availability, value, reason]
      properties:
        state:
          type: string
          enum:
            - READY
            - EMPTY
            - FEATURE_DISABLED
            - SIMULATION_ONLY
            - USER_INELIGIBLE
            - PENDING_VERIFICATION
            - PROVIDER_UNAVAILABLE
            - SERVICE_UNAVAILABLE
            - MIXED_CURRENCY_WITHOUT_CONVERSION
            - VALUATION_UNAVAILABLE
        availability:
          type: string
          enum: [IMPLEMENTED, AVAILABLE_SIMULATION, NOT_YET_PRODUCTIZED, EXTERNAL_PROVIDER_REQUIRED]
        value: { nullable: true }
        reason: { type: string, nullable: true }
    ConsumerAccount:
      type: object
      required: [id, productType, status, currency, openedAt, restrictions, productConfiguration]
      properties:
        id: { type: string }
        productType:
          type: string
          enum: [CASH_ACCOUNT, CHECKING_PAYMENT, SAVINGS, MULTI_CURRENCY, INVESTMENT_CASH, EXCHANGE_CASH]
        status:
          type: string
          enum: [PENDING, ACTIVE, RESTRICTED, FROZEN, CLOSING, CLOSED]
          description: Server-derived lifecycle. Clients cannot POST status=ACTIVE.
        domainStatus: { type: string }
        currency: { type: string }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        restrictions:
          type: array
          items:
            type: string
            enum:
              - DEBIT_BLOCKED
              - CREDIT_BLOCKED
              - WITHDRAWAL_BLOCKED
              - TRANSFER_BLOCKED
              - TRADING_BLOCKED
              - CARD_BLOCKED
              - COMPLIANCE_REVIEW
        productConfiguration:
          type: object
          required: [licensingClaim, environment, liveBanking]
          properties:
            licensingClaim: { type: string, enum: [NOT_A_LICENSED_BANK_ACCOUNT] }
            environment: { type: string, enum: [simulation] }
            liveBanking: { type: boolean, enum: [false] }
        balance:
          allOf:
            - { $ref: "#/components/schemas/ResourceField" }
            - properties:
                value: { $ref: "#/components/schemas/AccountBalanceView", nullable: true }
    ConsumerActivity:
      type: object
      required: [activityId, type, direction, amount, currency, status, description, occurredAt]
      properties:
        activityId: { type: string }
        type: { type: string }
        direction: { type: string, enum: [IN, OUT, HOLD] }
        amount: { $ref: "#/components/schemas/MoneyView" }
        currency: { type: string }
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, REVERSED, CANCELLED, ACTION_REQUIRED]
        counterpartyDisplay: { type: string, nullable: true }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        category: { type: string }
        relatedActionId: { type: string, nullable: true }
        fee: { $ref: "#/components/schemas/MoneyView", nullable: true }
    ActivityPage:
      allOf:
        - { $ref: "#/components/schemas/ResourceField" }
        - properties:
            value:
              type: object
              nullable: true
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/ConsumerActivity" }
                nextCursor: { type: string, nullable: true }
                hasMore: { type: boolean }
    AccountStatement:
      allOf:
        - { $ref: "#/components/schemas/ResourceField" }
        - properties:
            value:
              type: object
              nullable: true
              properties:
                statementId: { type: string }
                accountId: { type: string }
                currency: { type: string }
                periodStart: { type: string, format: date-time }
                periodEnd: { type: string, format: date-time }
                opening: { $ref: "#/components/schemas/MoneyView" }
                closing: { $ref: "#/components/schemas/MoneyView" }
                fees: { $ref: "#/components/schemas/MoneyView" }
                transactions:
                  type: array
                  items:
                    type: object
                    properties:
                      postedAt: { type: string, format: date-time }
                      direction: { type: string }
                      amount: { $ref: "#/components/schemas/MoneyView" }
                      description: { type: string }
                      reference: { type: string }
    HomeResource:
      type: object
      required: [schema, generatedAt, wealth, accounts]
      properties:
        schema: { type: string, enum: [sunrey.consumer.home.v1] }
        generatedAt: { type: string, format: date-time }
        wealth:
          type: object
          properties:
            state: { type: string }
            availability: { type: string }
            value: { nullable: true }
            reason: { type: string, nullable: true }
            valuation:
              type: object
              required: [currency, status, currencies]
              properties:
                currency: { type: string }
                status: { type: string, enum: [AVAILABLE, NOT_REQUIRED, UNAVAILABLE] }
                currencies:
                  type: array
                  items: { type: string }
                reason: { type: string, nullable: true }
        accounts:
          allOf:
            - { $ref: "#/components/schemas/ResourceField" }
