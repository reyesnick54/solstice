      type: object
      required: [toolId, version, description, category, riskClass, readOnly, createsProposal, frontendMayInvokeDirectly]
      properties:
        toolId: { type: string }
        version: { type: string }
        description: { type: string }
        category: { type: string }
        riskClass:
          type: string
          enum: [READ, PROPOSAL, SAFE_USER_PREFERENCE, PRIVILEGED_FINANCIAL_MUTATION]
        readOnly: { type: boolean }
