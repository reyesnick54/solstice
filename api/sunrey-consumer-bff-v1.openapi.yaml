openapi: 3.1.0
info:
  title: SunRey Consumer Backend-for-Frontend
  version: v1
  description: >
    Lovable / mobile / responsive-web orchestration API.
    Not a ledger, Exchange, Agent runtime, Kernel, or payment processor.
    Financial fields are integer minor-unit strings. Production remains disabled.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/me:
    get:
      operationId: getMe
      summary: Get the authenticated customer profile
      responses:
        "200":
          description: Controlled profile
        "401":
          description: Authentication required
    patch:
      operationId: patchMe
      summary: Update authorized preference fields only
      description: KYC and legal-identity fields are rejected.
      responses:
        "200":
          description: Updated profile
        "403":
          description: Forbidden profile field
  /api/v1/me/home:
    get:
      operationId: getMeHome
      summary: Home aggregation contract
      responses:
        "200":
          description: Home resource
  /api/v1/me/bootstrap:
    get:
      operationId: getMeBootstrap
      summary: Authenticated frontend bootstrap
      responses:
        "200":
          description: Bootstrap resource
  /api/v1/me/capabilities:
    get:
      operationId: getMeCapabilities
      summary: Server-computed feature capabilities
      responses:
        "200":
          description: Capability map
  /api/v1/me/actions:
    get:
      operationId: getMeActions
      summary: Pending regulated actions
      responses:
        "200":
          description: Action status list
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: List customer accounts
      responses:
        "200":
          description: Account read models
  /api/v1/accounts/{id}:
    get:
      operationId: getAccount
      summary: Get one owned account
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Account read model
        "403":
          description: Resource not owned
  /api/v1/accounts/{id}/activity:
    get:
      operationId: getAccountActivity
      summary: Cursor-paginated account activity
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Activity page
  /api/v1/catalog/resources:
    get:
      operationId: listConsumerResources
      summary: Consumer resource catalog
      responses:
        "200":
          description: Resource descriptors
  /api/v1/catalog/enums:
    get:
      operationId: listConsumerEnums
      summary: Client-safe enumerations
      responses:
        "200":
          description: Enumerations
  /api/v1/sandbox/personas:
    get:
      operationId: listSandboxPersonas
      summary: Non-production sandbox personas
      responses:
        "200":
          description: Sandbox persona list
  /api/v1/payments:
    get:
      operationId: listPayments
      summary: List the authenticated customer's payments
      description: Backend owns authoritative status. Production money movement stays disabled.
      responses:
        "200":
          description: Payment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        "401":
          description: Authentication required
    post:
      operationId: createPayment
      summary: Create a payment from a quote or destination
      description: >
        Internal SunRey transfers settle atomically on the canonical Ledger.
        External rails stay simulation-only. Requires Idempotency-Key.
      responses:
        "200":
          description: Payment resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          description: Step-up or authentication required
        "403":
          description: Kernel refused or resource not owned
  /api/v1/payments/quote:
    post:
      operationId: quotePayment
      summary: Preview a payment without executing
      description: Does not promise settlement time. FX and rail fees are simulation-only.
      responses:
        "200":
          description: Payment quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentQuote"
        "401":
          description: Authentication required
  /api/v1/payments/{id}:
    get:
      operationId: getPayment
      summary: Get one owned payment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Payment resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "403":
          description: Resource not owned
        "404":
          description: Not found
  /api/v1/payments/{id}/approve:
    post:
      operationId: approvePayment
      summary: Approve a payment that is awaiting customer confirmation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "403":
          description: Resource not owned
        "404":
          description: Approval not found
  /api/v1/fx:
    get:
      operationId: getFx
      summary: FX resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/cards:
    get:
      operationId: getCards
      summary: Cards resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/grow:
    get:
      operationId: getGrow
      summary: Grow My Money resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/agent:
    get:
      operationId: getAgent
      summary: Agent resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/exchange:
    get:
      operationId: getExchange
      summary: Exchange resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/recipients:
    get:
      operationId: listRecipients
      summary: List the authenticated customer's recipients
      responses:
        "200":
          description: Recipient list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipientList"
        "401":
          description: Authentication required
    post:
      operationId: createRecipient
      summary: Create a recipient
      description: >
        Frontend cannot mark a recipient verified. Agents cannot add
        beneficiaries. Kernel, step-up, device risk, and screening apply.
      responses:
        "200":
          description: Recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipient"
        "401":
          description: Step-up or authentication required
        "403":
          description: Cross-user denied
  /api/v1/recipients/{id}:
    get:
      operationId: getRecipient
      summary: Get one owned recipient
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipient"
        "403":
          description: Resource not owned
        "404":
          description: Not found
  /api/v1/goals:
    get:
      operationId: getGoals
      summary: Goals resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/portfolio:
    get:
      operationId: getPortfolio
      summary: Portfolio resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/wallets:
    get:
      operationId: getWallets
      summary: Wallets resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/data:
    get:
      operationId: getDataVault
      summary: Data vault resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/security:
    get:
      operationId: getSecurity
      summary: Security resource stub
      responses:
        "200":
          description: Honest availability
  /api/v1/notifications:
    get:
      operationId: getNotifications
      summary: Notifications resource stub
      responses:
        "200":
          description: Honest availability
components:
  schemas:
    MoneyResource:
      type: object
      required: [minorUnits, currency]
      properties:
        minorUnits: { type: string }
        currency: { type: string }
    PaymentStatus:
      type: string
      enum:
        - DRAFT
        - QUOTED
        - AWAITING_APPROVAL
        - AWAITING_STEP_UP_AUTH
        - AWAITING_COMPLIANCE
        - AUTHORIZED
        - QUEUED
        - SUBMITTED
        - PROCESSING
        - SETTLED
        - FAILED
        - CANCELLED
        - RETURNED
        - REVERSED
    Recipient:
      type: object
      required: [id, ownerId, displayName, destinationType, country, currency, displayHint, verificationStatus, createdAt]
      properties:
        id: { type: string }
        ownerId: { type: string }
        displayName: { type: string }
        destinationType:
          type: string
          enum: [SUNREY_USER, DOMESTIC_BANK, INTERNATIONAL_BANK, WALLET]
        country: { type: string }
        currency: { type: string }
        displayHint: { type: string }
        relationship: { type: string, nullable: true }
        purpose: { type: string, nullable: true }
        verificationStatus:
          type: string
          enum: [PENDING, ACTIVE, REVIEW, BLOCKED, DISABLED]
        screeningStatus: { type: string }
        createdAt: { type: string }
    RecipientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recipient"
    PaymentQuote:
      type: object
      required: [quoteId, sourceAmount, currency, fees, estimatedDeliveryClass, settlementTimePromise, complianceState, productionMoneyMovement]
      properties:
        quoteId: { type: string }
        sourceAmount:
          $ref: "#/components/schemas/MoneyResource"
        destinationAmount:
          $ref: "#/components/schemas/MoneyResource"
        currency: { type: string }
        fees:
          type: array
          items:
            type: object
        estimatedDeliveryClass: { type: string }
        settlementTimePromise: { type: "null" }
        complianceState: { type: string }
        expiresAt: { type: string }
        productionMoneyMovement: { type: boolean, enum: [false] }
    Payment:
      type: object
      required: [paymentId, payerId, sourceAccountId, amount, currency, paymentType, status, productionMoneyMovement]
      properties:
        paymentId: { type: string }
        payerId: { type: string }
        sourceAccountId: { type: string }
        beneficiaryId: { type: string, nullable: true }
        amount:
          $ref: "#/components/schemas/MoneyResource"
        currency: { type: string }
        paymentType: { type: string }
        railPreference: { type: string }
        purpose: { type: string }
        status:
          $ref: "#/components/schemas/PaymentStatus"
        approvalId: { type: string, nullable: true }
        workflowId: { type: string, nullable: true }
        productionMoneyMovement: { type: boolean, enum: [false] }
    PaymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        productionMoneyMovement: { type: boolean, enum: [false] }
    PaymentApproval:
      type: object
      required: [approvalId, paymentId, status, createdAt]
      properties:
        approvalId: { type: string }
        paymentId: { type: string }
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        createdAt: { type: string }
        decidedAt: { type: string, nullable: true }
