      type: object
      required: [status, toolId, version, executed, payload]
      description: Structured Tool Runtime result. The model must not invent missing financial numbers.
      properties:
        status:
          type: string
          enum: [SUCCESS, ACTION_REQUIRED, APPROVAL_REQUIRED, NOT_ELIGIBLE, UNAVAILABLE, FAILED]
        toolId: { type: string }
        version: { type: string }
