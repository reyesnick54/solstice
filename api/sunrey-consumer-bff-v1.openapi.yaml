          schema: { type: string }
      responses:
        "200":
          description: Market detail
  /api/v1/exchange/markets/{marketId}/ticker:
    get:
      operationId: getExchangeTicker
      summary: Ticker
      parameters:
        - in: path
          name: marketId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Indicative ticker
  /api/v1/exchange/markets/{marketId}/order-book:
    get:
      operationId: getExchangeOrderBook
      summary: Order book
      parameters:
        - in: path
          name: marketId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Depth
  /api/v1/exchange/markets/{marketId}/chart:
    get:
      operationId: getExchangeChart
      summary: Asset chart
      parameters:
        - in: path
          name: marketId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Candles when history exists
  /api/v1/exchange/eligibility:
    get:
      operationId: getExchangeEligibility
      summary: KYC / Exchange eligibility
      responses:
        "200":
          description: Server-owned eligibility
  /api/v1/exchange/holdings:
    get:
      operationId: getExchangeHoldings
      summary: Wallet / holdings
      responses:
        "200":
          description: Holdings
  /api/v1/exchange/fund:
    post:
      operationId: fundExchangeSandbox
      summary: Fund sandbox quote account
      responses:
        "200":
          description: Sandbox faucet
  /api/v1/exchange/preview:
    post:
      operationId: previewExchangeOrder
      summary: Order preview
      responses:
        "200":
          description: Preview
        "400":
          description: Invalid quantity
  /api/v1/exchange/proposals:
    post:
      operationId: createExchangeProposal
      summary: Create Exchange order proposal
      responses:
        "201":
          description: Proposal
  /api/v1/exchange/proposals/{id}/approve:
    post:
      operationId: approveExchangeProposal
      summary: Human approval and step-up
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approved proposal
        "401":
          description: Step-up required
        "403":
          description: Agent self-approval refused
  /api/v1/exchange/proposals/{id}/submit:
    post:
      operationId: submitExchangeProposal
      summary: Submit after Execution Authority
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order / fill
  /api/v1/exchange/orders:
    get:
      operationId: listExchangeOrders
      summary: Open orders and history
      responses:
        "200":
          description: Orders
  /api/v1/exchange/fills:
    get:
      operationId: listExchangeFills
      summary: Fills
      responses:
        "200":
          description: Fills
  /api/v1/exchange/stream:
    get:
      operationId: getExchangeStream
      summary: Market-data stream status
      responses:
        "200":
          description: Snapshot-then-increment support
  /api/v1/recipients:
    get:
      operationId: listRecipients
      summary: List the authenticated customer's recipients
      responses:
        "200":
          description: Recipient list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipientList"
        "401":
          description: Authentication required
    post:
      operationId: createRecipient
      summary: Create a recipient
      description: >
        Frontend cannot mark a recipient verified. Agents cannot add
        beneficiaries. Kernel, step-up, device risk, and screening apply.
      responses:
        "200":
          description: Recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipient"
        "401":
          description: Step-up or authentication required
        "403":
          description: Cross-user denied
  /api/v1/recipients/{id}:
    get:
      operationId: getRecipient
      summary: Get one owned recipient
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipient"
        "403":
          description: Resource not owned
        "404":
          description: Not found
  /api/v1/goals:
    get:
      operationId: getGoals
      summary: Goals alias for Grow goals
      responses:
        "200":
          description: Goals
  /api/v1/portfolio:
    get:
      operationId: getPortfolio
      summary: Portfolio alias for Grow portfolio
      responses:
        "200":
          description: Portfolio
  /api/v1/wallets:
    get:
      operationId: getWallets
      summary: Wallet home
      responses:
        "200":
          description: Wallet and holdings
  /api/v1/wallets/deposit-address:
    get:
      operationId: getWalletDepositAddress
      summary: Retrieve deposit address
      responses:
        "200":
          description: Canonical custody address
  /api/v1/wallets/deposits/simulate:
    post:
      operationId: simulateWalletDeposit
      summary: Simulate native-chain deposit
      responses:
        "200":
          description: Detected and finalized after test finality
  /api/v1/wallets/withdrawals/quote:
    post:
      operationId: quoteWalletWithdrawal
      summary: Withdrawal quote with destination and Travel Rule
      responses:
        "200":
          description: Quote
        "403":
          description: Travel Rule pending or destination invalid
  /api/v1/wallets/withdrawals:
    post:
      operationId: submitWalletWithdrawal
      summary: Approved withdrawal
      responses:
        "200":
          description: Finalized withdrawal
  /api/v1/wallets/transactions:
    get:
      operationId: listWalletTransactions
      summary: Wallet transaction history
      responses:
        "200":
          description: Activity
  /api/v1/economy:
