                - PAYMENT_QUOTE
                - FX_QUOTE
                - GROWTH_OPPORTUNITY
                - GROWTH_PROPOSAL
                - PORTFOLIO_CARD
                - TRADE_PROPOSAL
                - APPROVAL_CARD
                - TRANSACTION_STATUS
