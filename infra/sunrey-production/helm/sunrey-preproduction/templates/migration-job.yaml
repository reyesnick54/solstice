apiVersion: batch/v1
kind: Job
metadata:
  name: sunrey-db-migrate
  namespace: {{ .Values.namespace }}
  labels:
    app: migration
    sunrey.zone: DATA_PRIVATE
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: migration
        sunrey.zone: DATA_PRIVATE
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: migrate
          # SIMULATION_REHEARSAL_PLACEHOLDER — not a published registry digest
          image: {{ .Values.image.repository }}@{{ .Values.image.digest }}
          command: ["node", "scripts/postgres-migrate.mjs"]
          env:
            - name: DATABASE_CREDENTIAL_REF
              value: secret://sunrey-preproduction/database/migrator
            - name: PGSSLMODE
              value: require
            - name: SUNREY_MIGRATE_BEFORE_ROLLOUT
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
