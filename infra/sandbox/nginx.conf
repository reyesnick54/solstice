# SunRey sandbox reverse-proxy template (TLS termination at edge)
#
# Expected architecture:
#   Internet -> TLS terminator (Caddy/Nginx/Traefik) -> internal services
#
# Domains (when DNS is authorized):
#   app.sunrey.xyz  -> consumer-bff:8443
#   api.sunrey.xyz  -> platform-api:8080
#
# Internal-only (never public):
#   /internal/v1/*  -> platform-api:8080 (operator token + role required)

upstream sunrey_platform_api {
    server platform-api:8080;
    keepalive 16;
}

upstream sunrey_consumer_bff {
    server consumer-bff:8443;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name api.sunrey.xyz;

    # TLS certificates managed by infrastructure automation (Let's Encrypt / Hetzner LB)
    # ssl_certificate     /etc/ssl/certs/api.sunrey.xyz.pem;
    # ssl_certificate_key /etc/ssl/private/api.sunrey.xyz.key;

    location /health {
        proxy_pass http://sunrey_platform_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ready {
        proxy_pass http://sunrey_platform_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://sunrey_platform_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal operations must not be exposed on the public API hostname.
    location /internal/ {
        return 403;
    }
}

server {
    listen 443 ssl http2;
    server_name app.sunrey.xyz;

    location / {
        proxy_pass http://sunrey_consumer_bff;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
