# SunRey sandbox reverse-proxy template (TLS termination at edge)
#
# Expected architecture:
#   Internet -> TLS terminator (Caddy/Nginx/Traefik/Cloudflare) -> Consumer BFF
#
# Domains (when DNS is authorized):
#   app.sunrey.xyz  -> frontend (hosted separately; CORS origin only)
#   api.sunrey.xyz  -> consumer-bff:8443
#
# Internal-only (never public):
#   /internal/v1/*  -> platform-api:8080 (operator token + role required)

upstream sunrey_consumer_bff {
    server consumer-bff:8443;
    keepalive 16;
}

upstream sunrey_platform_api {
    server platform-api:8080;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name api.sunrey.xyz;

    # TLS certificates managed by infrastructure automation (Let's Encrypt / Hetzner LB / Cloudflare origin)
    # ssl_certificate     /etc/ssl/certs/api.sunrey.xyz.pem;
    # ssl_certificate_key /etc/ssl/private/api.sunrey.xyz.key;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /health {
        proxy_pass http://sunrey_consumer_bff;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /ready {
        proxy_pass http://sunrey_consumer_bff;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://sunrey_consumer_bff;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /internal/ {
        return 403;
    }
}
